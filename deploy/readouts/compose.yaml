name: quickstark-readouts

services:
  quickstark-readouts:
    image: node:24-alpine
    container_name: quickstark-readouts
    hostname: quickstark-readouts
    working_dir: /opt/quickstark
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      QS_READOUT_DIR: /docker/appdata/quickstark-readouts
      QS_READOUT_PUBLICATION_MODE: hosted
      QS_READOUT_HOMEPAGE: portfolio
      QS_READOUT_ALLOWED_PROJECTS: "*"
      QS_READOUT_CURRENT_PROJECT: github.com/quickstark/skills
      QS_READOUT_TRUSTED_PROXY: "true"
      QS_READOUT_PREFERENCE_SECRET_FILE: /run/quickstark-readout-preferences.key
    command:
      - node
      - /opt/quickstark/scripts/qs-skill-readout.mjs
      - serve
      - --directory
      - /docker/appdata/quickstark-readouts
      - --host
      - quickstark-readouts
      - --port
      - "4173"
    volumes:
      - /github/skills:/opt/quickstark:ro
      - /docker/appdata/quickstark-readouts:/docker/appdata/quickstark-readouts:ro
      - /docker/appdata/quickstark-readouts-config/readout-preferences.key:/run/quickstark-readout-preferences.key:ro
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://quickstark-readouts:4173/__quickstark_health').then(r=>r.json()).then(j=>{if(j.service!=='quickstark-skill-readouts')process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.quickstark-readouts.rule=Host(`reports.quickstark.com`)
      - traefik.http.routers.quickstark-readouts.entrypoints=https
      - traefik.http.routers.quickstark-readouts.tls.certresolver=cloudflare
      - traefik.http.routers.quickstark-readouts.middlewares=authelia@file
      - traefik.http.services.quickstark-readouts.loadbalancer.server.port=4173

  quickstark-readout-settings:
    image: node:24-alpine
    container_name: quickstark-readout-settings
    hostname: quickstark-readout-settings
    working_dir: /opt/quickstark
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      QS_READOUT_SETTINGS_HOST: quickstark-readout-settings
      QS_READOUT_SETTINGS_PORT: "4175"
      QS_READOUT_SETTINGS_TRUSTED_PROXY: "true"
      QS_READOUT_SETTINGS_TRUSTED_PROXY_ADDRESSES: "10.250.12.2"
      QS_READOUT_SETTINGS_ADMIN_GROUPS: admins
      QS_READOUT_CREDENTIALS_DIRECTORY: /run/quickstark-credentials
      QS_READOUT_PRODUCERS_FILE: /run/quickstark-config/readout-producers.json
      QS_READOUT_PREFERENCE_SECRET_FILE: /run/quickstark-config/readout-preferences.key
    command:
      - node
      - /opt/quickstark/scripts/qs-readout-settings.mjs
    volumes:
      - /github/skills:/opt/quickstark:ro
      - /docker/appdata/quickstark-readouts-credentials:/run/quickstark-credentials:rw
      - /docker/appdata/quickstark-readouts-config:/run/quickstark-config:rw
    networks:
      settings_auth:
        ipv4_address: 10.250.12.3
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://quickstark-readout-settings:4175/__quickstark_settings_health').then(r=>r.json()).then(j=>{if(j.service!=='quickstark-readout-settings')process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=quickstark-readout-settings-auth
      - traefik.http.routers.quickstark-readout-settings.rule=Host(`reports.quickstark.com`) && (Path(`/settings`) || PathPrefix(`/settings/`))
      - traefik.http.routers.quickstark-readout-settings.entrypoints=https
      - traefik.http.routers.quickstark-readout-settings.tls.certresolver=cloudflare
      - traefik.http.routers.quickstark-readout-settings.middlewares=authelia@file
      - traefik.http.routers.quickstark-readout-settings.priority=250
      - traefik.http.services.quickstark-readout-settings.loadbalancer.server.port=4175

  quickstark-readout-prototype:
    image: node:24-alpine
    container_name: quickstark-readout-prototype
    hostname: quickstark-readout-prototype
    working_dir: /opt/quickstark
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      QS_READOUT_DIR: /docker/appdata/quickstark-readouts
      QS_READOUT_ALLOWED_PROJECTS: github.com/quickstark/skills
      QS_READOUT_PROTOTYPE_HOST: quickstark-readout-prototype
      QS_READOUT_PROTOTYPE_PORT: "4181"
      QS_READOUT_PROTOTYPE_BASE_PATH: /prototype
    command:
      - node
      - /opt/quickstark/scripts/qs-readout-gallery.prototype.mjs
    volumes:
      - /github/skills:/opt/quickstark:ro
      - /docker/appdata/quickstark-readouts:/docker/appdata/quickstark-readouts:ro
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://quickstark-readout-prototype:4181/prototype/__quickstark_prototype_health').then(r=>r.json()).then(j=>{if(j.service!=='quickstark-skill-readout-prototype')process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.quickstark-readout-prototype.rule=Host(`reports.quickstark.com`) && (Path(`/prototype`) || PathPrefix(`/prototype/`))
      - traefik.http.routers.quickstark-readout-prototype.entrypoints=https
      - traefik.http.routers.quickstark-readout-prototype.tls.certresolver=cloudflare
      - traefik.http.routers.quickstark-readout-prototype.middlewares=authelia@file
      - traefik.http.routers.quickstark-readout-prototype.priority=150
      - traefik.http.services.quickstark-readout-prototype.loadbalancer.server.port=4181

  quickstark-readout-ingestion:
    image: node:24-alpine
    container_name: quickstark-readout-ingestion
    hostname: quickstark-readout-ingestion
    working_dir: /opt/quickstark
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      QS_READOUT_DIR: /docker/appdata/quickstark-readouts
      QS_READOUT_PUBLIC_URL: https://reports.quickstark.com/
      QS_READOUT_ALLOWED_PROJECTS: "*"
      QS_READOUT_PRODUCERS_FILE: /run/quickstark/readout-producers.json
    command:
      - node
      - /opt/quickstark/scripts/qs-skill-readout.mjs
      - ingest
      - --directory
      - /docker/appdata/quickstark-readouts
      - --host
      - quickstark-readout-ingestion
      - --port
      - "4174"
    volumes:
      - /github/skills:/opt/quickstark:ro
      - /docker/appdata/quickstark-readouts:/docker/appdata/quickstark-readouts:rw
      - /docker/appdata/quickstark-readouts-config:/run/quickstark:ro
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://quickstark-readout-ingestion:4174/__quickstark_ingestion_health').then(r=>r.json()).then(j=>{if(j.service!=='quickstark-skill-readout-ingestion')process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.quickstark-readout-ingestion.rule=Host(`reports.quickstark.com`) && Path(`/api/v1/readouts`)
      - traefik.http.routers.quickstark-readout-ingestion.entrypoints=https
      - traefik.http.routers.quickstark-readout-ingestion.tls.certresolver=cloudflare
      - traefik.http.routers.quickstark-readout-ingestion.priority=200
      - traefik.http.services.quickstark-readout-ingestion.loadbalancer.server.port=4174

networks:
  proxy:
    external: true
  settings_auth:
    name: quickstark-readout-settings-auth
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.250.12.0/29
