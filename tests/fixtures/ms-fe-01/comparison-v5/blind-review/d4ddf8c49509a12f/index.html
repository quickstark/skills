<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <meta name="description" content="Thoughtful films, clear stories, lasting places. An independent film practice.">
  <title>FIELD NOTES</title>
  <style>
    :root { color-scheme: light; --paper: #f6f3eb; --ink: #163b43; --accent: #bf4e2e; --line: rgba(22,59,67,.26); }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 28px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 6px; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
    .page { width: min(100% - 96px, 1536px); margin-inline: auto; }
    .site-header { display: flex; align-items: center; justify-content: space-between; min-height: 112px; border-bottom: 1px solid var(--line); gap: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 750; letter-spacing: -.06em; white-space: nowrap; }
    .brand::before { content: ""; width: 12px; height: 12px; background: var(--accent); flex: none; }
    nav { display: flex; gap: clamp(20px, 3vw, 48px); }
    nav a { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; text-decoration: none; }
    nav a:hover { color: var(--accent); text-decoration: underline; }
    .hero { padding-top: clamp(48px, 5.8vw, 90px); }
    h1 { margin: 0; max-width: 1250px; font-size: clamp(60px, 8.8vw, 136px); line-height: .99; font-weight: 500; letter-spacing: -.065em; }
    h1 span { display: block; }
    .hero-details { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin: 34px 0 36px; }
    .intro { margin: 0; max-width: 410px; font-size: clamp(18px, 1.65vw, 24px); line-height: 1.45; letter-spacing: -.025em; }
    .primary { display: inline-flex; justify-content: space-between; align-items: center; gap: 44px; min-height: 56px; padding: 16px 22px; background: var(--accent); color: var(--paper); font-size: 14px; font-weight: 600; text-decoration: none; flex: none; transition: background-color 180ms ease; }
    .primary:hover { background: var(--ink); }
    .primary svg { width: 20px; height: 20px; transition: transform 180ms ease; }
    .primary:hover svg { transform: translateY(3px); }
    .film { position: relative; isolation: isolate; aspect-ratio: 2.4; overflow: hidden; background: #173f49 url('assets/poster.svg') center / cover no-repeat; }
    .film video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .film-control { position: absolute; right: 20px; bottom: 20px; display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--paper); border-radius: 0; background: var(--paper); color: var(--ink); cursor: pointer; transition: background-color 180ms ease, color 180ms ease; }
    .film-control[hidden] { display: none; }
    .film-control:hover { background: var(--ink); color: var(--paper); }
    .film-control:focus-visible { outline-color: var(--paper); outline-offset: 4px; box-shadow: 0 0 0 8px var(--ink); }
    .film-control svg { width: 19px; height: 19px; fill: currentColor; }
    .film-control .pause { display: none; }
    .film-control[data-playing="true"] .pause { display: block; }
    .film-control[data-playing="true"] .play { display: none; }
    .work { display: grid; grid-template-columns: 1fr 2fr; column-gap: 48px; padding-top: 88px; padding-bottom: 90px; scroll-margin-top: 28px; }
    h2 { margin: 0; font-size: 18px; line-height: 1.5; font-weight: 500; letter-spacing: -.025em; }
    .work-list { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
    .work-list li { padding: 24px 0 28px; border-bottom: 1px solid var(--line); font-size: clamp(24px, 2.7vw, 40px); line-height: 1.3; font-weight: 400; letter-spacing: -.04em; }
    .about { border-top: 1px solid var(--line); padding: 44px 0 58px; scroll-margin-top: 28px; }
    .about p { max-width: 780px; margin: 0; font-size: clamp(30px, 4vw, 58px); line-height: 1.12; letter-spacing: -.045em; }
    @media (min-width: 1800px) { .hero { padding-top: 90px; } }
    @media (max-width: 900px) {
      .page { width: calc(100% - 56px); }
      .site-header { min-height: 94px; }
      h1 { font-size: clamp(60px, 8.8vw, 80px); }
      .hero-details { margin-top: 30px; }
      .intro { max-width: 300px; }
      .primary { gap: 24px; }
      .film { aspect-ratio: 1.85; }
      .work { padding-block: 64px; grid-template-columns: 1fr 1.8fr; gap: 28px; }
    }
    @media (max-width: 540px) {
      .page { width: calc(100% - 40px); }
      .site-header { min-height: 84px; gap: 12px; }
      .brand { font-size: 16px; gap: 7px; }
      .brand::before { width: 8px; height: 8px; }
      nav { gap: 15px; }
      nav a { font-size: 12px; }
      .hero { padding-top: 46px; }
      h1 { font-size: clamp(44px, 12.5vw, 67px); line-height: 1.025; letter-spacing: -.065em; }
      .hero-details { display: block; margin: 25px 0 28px; }
      .intro { max-width: 280px; font-size: 18px; }
      .primary { margin-top: 24px; min-height: 52px; gap: 33px; padding-inline: 18px; }
      .film { aspect-ratio: 1.16; }
      .film-control { right: 12px; bottom: 12px; }
      .work { display: block; padding-block: 48px; }
      h2 { margin-bottom: 24px; font-size: 17px; }
      .work-list li { font-size: 26px; padding-block: 21px; }
      .about { padding: 31px 0 42px; }
      .about p { max-width: 320px; font-size: 35px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .site-header { min-height: 68px; }
      .hero { padding-top: 30px; }
      h1 { font-size: clamp(44px, 7vw, 72px); }
      .hero-details { margin-block: 22px; align-items: center; }
      .film { aspect-ratio: 2.8; }
      .work { padding-block: 42px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">FIELD NOTES</div>
      <nav aria-label="Main navigation">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="mailto:studio@example.test">Contact</a>
      </nav>
    </header>
    <main>
      <section class="hero" aria-labelledby="hero-heading">
        <h1 id="hero-heading"><span>Make room for</span> <span>the moving world.</span></h1>
        <div class="hero-details">
          <p class="intro">Thoughtful films, clear stories, lasting places.</p>
          <a class="primary" href="#work">Explore the work<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3v17m-6-6 6 6 6-6"/></svg></a>
        </div>
        <div class="film">
          <video muted loop playsinline preload="none" poster="assets/poster.svg" aria-hidden="true" tabindex="-1">
            <source src="assets/scene.webm" type="video/webm">
          </video>
          <button class="film-control" type="button" aria-label="Play film" data-playing="false" hidden>
            <svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4 13 8-13 8z"/></svg>
            <svg class="pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
          </button>
        </div>
      </section>
      <section class="work" id="work" aria-labelledby="work-heading">
        <h2 id="work-heading">Selected work</h2>
        <ul class="work-list">
          <li>Tidal study / 2026</li>
          <li>Mountain light / 2025</li>
        </ul>
      </section>
      <section class="about" id="about" aria-label="About">
        <p>An independent film practice.</p>
      </section>
    </main>
  </div>
  <script>
    (() => {
      const video = document.querySelector('video');
      const control = document.querySelector('.film-control');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let userPaused = false;
      let failed = false;
      let inView = true;
      const syncControl = () => {
        const playing = !video.paused;
        control.dataset.playing = String(playing);
        control.setAttribute('aria-label', playing ? 'Pause film' : 'Play film');
      };
      const play = () => {
        if (failed) return;
        const attempt = video.play();
        if (attempt) attempt.catch(syncControl);
      };
      const settlePlayback = () => {
        if (document.hidden || !inView || reducedMotion.matches || userPaused) video.pause();
        else play();
      };
      control.hidden = false;
      control.addEventListener('click', () => {
        if (video.paused) { userPaused = false; play(); }
        else { userPaused = true; video.pause(); }
      });
      video.addEventListener('play', syncControl);
      video.addEventListener('pause', syncControl);
      const showPoster = () => {
        failed = true;
        video.pause();
        video.hidden = true;
        video.style.display = 'none';
        control.hidden = true;
      };
      video.addEventListener('error', showPoster);
      video.querySelector('source').addEventListener('error', showPoster);
      document.addEventListener('visibilitychange', settlePlayback);
      if (reducedMotion.addEventListener) reducedMotion.addEventListener('change', settlePlayback);
      else if (reducedMotion.addListener) reducedMotion.addListener(settlePlayback);
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(([entry]) => {
          inView = entry.isIntersecting;
          settlePlayback();
        }, { threshold: 0 }).observe(video);
      }
      settlePlayback();
    })();
  </script>
</body>
</html>
