<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIELD NOTES</title>
<style>
:root{--paper:#f6f3eb;--ink:#163b43;--accent:#bf4e2e;--radius:0px;--font:system-ui}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px var(--font)}
header,section{padding:32px}
a,button{border-radius:var(--radius);font-family:var(--font)}
.cta{display:inline-block;background:var(--ink);color:var(--paper);padding:16px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
[hidden]{display:none!important}
header{max-width:1600px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:24px;padding-block:28px;border-bottom:1px solid var(--ink)}
header>span{font-weight:750;letter-spacing:.1em;font-size:16px}
nav{display:flex;gap:32px}
main{max-width:1600px;margin:auto}
#intro{padding-top:64px;padding-bottom:0}
.eyebrow{margin:0 0 28px;font-size:12px;line-height:1.5;letter-spacing:.16em;color:var(--accent);font-weight:650}
h1{max-width:1200px;font-size:clamp(52px,7.8vw,112px);font-weight:500;line-height:1.02;letter-spacing:-.055em;margin:0;text-wrap:balance}
.intro-footer{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:32px 0 44px}
.intro-footer>p{margin:0;max-width:420px;line-height:1.5}
.cta{flex-shrink:0}
.media{position:relative;background:var(--ink);isolation:isolate}
.media-frame{aspect-ratio:2.3;overflow:hidden;position:relative}
.media-frame>img,.media-frame>video{display:block;width:100%;height:100%;object-fit:cover;object-position:75% 50%}
.media-frame>video{position:absolute;inset:0}
.media-controls{position:absolute;right:16px;bottom:16px;z-index:1}
.media-controls button{display:flex;align-items:center;justify-content:center}
.media-controls svg{display:block;width:20px;height:20px;fill:currentColor}
.media-controls .play-icon{display:none}
.media-controls button[aria-pressed="true"] .pause-icon{display:none}
.media-controls button[aria-pressed="true"] .play-icon{display:block}
#work{padding-top:64px;padding-bottom:88px;display:grid;grid-template-columns:1fr 1fr;gap:32px}
#work h2{font-size:clamp(32px,3.5vw,48px);font-weight:500;line-height:1.1;letter-spacing:-.04em;margin:0}
.work-entry{border-top:2px solid var(--accent);padding-top:24px}
.work-title{font-size:clamp(22px,2.5vw,32px);line-height:1.25;letter-spacing:-.025em;margin:0 0 24px}
#detail{max-width:420px;line-height:1.5;margin-bottom:0}
@media(min-width:1600px){header{border-inline:32px solid var(--paper)}}
@media(max-width:767px){
 header,section{padding-inline:24px}
 header{padding-block:24px;gap:16px}
 nav{gap:20px}
 #intro{padding-top:44px}
 h1{font-size:clamp(48px,9.2vw,70px);max-width:650px}
 .eyebrow{margin-bottom:22px}
 .intro-footer{align-items:flex-start;flex-direction:column;gap:24px;margin:24px 0 32px}
 .intro-footer>p{max-width:340px}
 .media-frame{aspect-ratio:16/10}
 #work{grid-template-columns:1fr;gap:28px;padding-top:40px;padding-bottom:56px}
 .work-entry{padding-top:20px}
}
@media(max-width:359px){header,section{padding-inline:16px}nav{gap:12px}header>span{font-size:14px}h1{font-size:44px}}
@media(prefers-reduced-motion:reduce){.media-frame>video{display:none!important}.media-controls{display:none}}
</style>
</head>
<body>
<header><span>FIELD NOTES</span><nav><a href="#work">Work</a><a href="mailto:studio@example.test">Contact</a></nav></header>
<main>
<section id="intro">
<p class="eyebrow" data-enter>INDEPENDENT FILM / 2026</p>
<h1 data-enter data-delay="80">Make room for the moving world.</h1>
<div class="intro-footer"><p data-enter data-delay="160">Thoughtful films, clear stories, lasting places.</p><a class="cta" id="explore" href="#work" data-track="explore">Explore the work</a></div>
<div class="media" data-media>
<div class="media-frame"><img src="assets/poster.svg" width="960" height="540" alt=""><video src="assets/scene.webm" poster="assets/poster.svg" muted playsinline loop preload="none" aria-hidden="true" hidden></video></div>
<div class="media-controls"><button type="button" data-pause aria-label="Pause background video" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="pause-icon" d="M6 4h4v16H6zm8 0h4v16h-4z"/><path class="play-icon" d="M7 4v16l13-8z"/></svg></button></div>
</div>
</section>
<section id="work">
<h2 data-reveal>Selected work</h2>
<div class="work-entry"><p class="work-title" data-reveal data-delay="80">Tidal study / 2026</p><button id="details" type="button">Show details</button><p id="detail" hidden>Filmed on the northern coast.</p></div>
</section>
</main>
<script>window.analytics=[];document.querySelector('[data-track]').addEventListener('click',()=>window.analytics.push('explore'));document.querySelector('#details').addEventListener('click',()=>{document.querySelector('#detail').hidden=!document.querySelector('#detail').hidden});</script>
<script>
(() => {
  // Enhancement failures leave the complete page and poster visible.
  if (!window.matchMedia) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const active = new Set();
  let reveals, mediaObserver, disposed = false;
  const video = document.querySelector('[data-media] video');
  const button = document.querySelector('[data-pause]');
  let visible = false, userPaused = false, failed = false, epoch = 0;
  const listeners = [];
  const listen = (target, name, fn) => {
    target.addEventListener(name, fn);
    listeners.push(() => target.removeEventListener(name, fn));
  };
  const animate = el => {
    if (disposed || reduce.matches || !el.animate) return;
    const animation = el.animate([
      {opacity:.75,transform:'translateY(14px)'},
      {opacity:1,transform:'none'}
    ], {duration:600,delay:Math.min(160,Number(el.dataset.delay)||0),easing:'cubic-bezier(.22,1,.36,1)'});
    active.add(animation);
    animation.finished.then(() => active.delete(animation), () => active.delete(animation));
  };
  const stopMotion = () => {
    reveals?.disconnect();
    active.forEach(animation => animation.cancel());
    active.clear();
  };
  const still = () => {
    epoch++;
    video.pause();
    video.hidden = true;
  };
  const sync = async () => {
    button.hidden = disposed || reduce.matches || failed || !mediaObserver;
    button.setAttribute('aria-pressed', String(userPaused));
    button.setAttribute('aria-label', userPaused ? 'Play background video' : 'Pause background video');
    if (disposed || !visible || userPaused || failed || reduce.matches || document.hidden) {
      still();
      return;
    }
    const attempt = ++epoch;
    try {
      await video.play();
      if (attempt !== epoch || disposed) return;
      video.hidden = false;
    } catch {
      if (attempt !== epoch || disposed) return;
      failed = true;
      still();
      button.hidden = true;
    }
  };
  try {
    if (!reduce.matches) {
      document.querySelectorAll('[data-enter]').forEach(animate);
      if ('IntersectionObserver' in window) {
        const pending = new Set(document.querySelectorAll('[data-reveal]'));
        reveals = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            reveals.unobserve(entry.target);
            pending.delete(entry.target);
            animate(entry.target);
          });
          if (!pending.size) reveals.disconnect();
        }, {threshold:0});
        pending.forEach(el => reveals.observe(el));
      }
    }
  } catch { stopMotion(); }
  try {
    video.muted = true;
    if ('IntersectionObserver' in window) {
      mediaObserver = new IntersectionObserver(([entry]) => {
        visible = entry.isIntersecting && entry.intersectionRatio > 0;
        sync();
      }, {threshold:[0,.001]});
      mediaObserver.observe(document.querySelector('[data-media]'));
    }
    listen(button, 'click', () => {userPaused = !userPaused; sync();});
    listen(video, 'error', () => {failed = true; sync();});
    listen(document, 'visibilitychange', sync);
    listen(reduce, 'change', () => {stopMotion(); sync();});
  } catch { failed = true; still(); button.hidden = true; }
  const dispose = () => {
    disposed = true;
    stopMotion();
    mediaObserver?.disconnect();
    still();
    button.hidden = true;
    listeners.forEach(remove => remove());
  };
  // A persisted page keeps its lifecycle so it can resume safely from history.
  listen(window, 'pagehide', event => {if (event.persisted) still(); else dispose();});
  listen(window, 'pageshow', event => {if (event.persisted) sync();});
})();
</script>
</body>
</html>
