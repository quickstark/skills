<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f49">
  <meta name="description" content="A quiet study. An independent film practice.">
  <title>A quiet study. — An independent film practice.</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #f5f0e5;
      --ink: #173f49;
      --line: rgba(245, 240, 229, .4);
      --gutter: clamp(24px, 5vw, 88px);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ink); color: var(--paper); font-family: Arial, Helvetica, sans-serif; }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid #f1b85b; outline-offset: 7px; }
    .skip-link { position: absolute; top: 16px; left: 16px; padding: 12px 18px; background: var(--paper); color: var(--ink); z-index: 5; transform: translateY(-180%); }
    .skip-link:focus { transform: translateY(0); }
    .hero { position: relative; min-height: 700px; min-height: max(700px, 100svh); isolation: isolate; overflow: hidden; display: flex; flex-direction: column; }
    .hero-image { position: absolute; inset: 0; z-index: -3; width: 100%; height: 100%; object-fit: cover; object-position: 65% center; }
    .hero::before { content: ""; position: absolute; inset: 0; z-index: -2; background: linear-gradient(180deg, rgba(8, 30, 35, .32), transparent 35%, rgba(8, 30, 35, .25) 55%, rgba(8, 30, 35, .88)); }
    .hero-top { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; margin: 0 var(--gutter); padding: 34px 0 22px; border-bottom: 1px solid var(--line); }
    .hero-top p { margin: 0; font-size: 14px; line-height: 1.5; letter-spacing: .02em; }
    .frame-number { font-size: 11px; letter-spacing: .16em; white-space: nowrap; }
    .hero-content { margin-top: auto; padding: 120px var(--gutter) 50px; }
    .hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 36px; }
    h1 { margin: 0; max-width: 900px; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(76px, 9.6vw, 166px); line-height: .96; letter-spacing: -.065em; }
    h1 span { display: block; }
    .explore { width: 144px; aspect-ratio: 1; flex: 0 0 144px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; background: var(--paper); color: #142f34; text-decoration: none; border: 1px solid var(--paper); font-size: 14px; transition: background-color .2s, color .2s; }
    .explore svg { width: 26px; height: 26px; align-self: flex-end; }
    .explore:hover { background: #f1b85b; }
    .explore:active { background: #dfaa51; }
    .hero-caption { margin: 34px 0 0; padding-top: 17px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 20px; font-size: 10px; line-height: 1.6; letter-spacing: .12em; text-transform: uppercase; }
    .work { background: var(--paper); color: #17383f; padding: 82px var(--gutter) 96px; scroll-margin-top: 24px; }
    .work-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; margin-bottom: 36px; }
    .section-number { font-size: 11px; letter-spacing: .12em; }
    h2 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(38px, 5vw, 68px); letter-spacing: -.04em; }
    figure { margin: 0; }
    .work-image { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
    figcaption { display: flex; justify-content: space-between; gap: 20px; border-bottom: 1px solid #b3bcb4; padding: 18px 0; font-size: 12px; line-height: 1.5; }
    @media (min-width: 1600px) { .hero-content { padding-bottom: 64px; } }
    @media (max-width: 650px) {
      .hero { min-height: max(680px, 100svh); }
      .hero-top { padding-top: 24px; }
      .hero-top p { max-width: 200px; font-size: 12px; }
      .frame-number { font-size: 10px; }
      .hero-image { object-position: 66% center; }
      .hero-content { padding-top: 100px; padding-bottom: 28px; }
      .hero-row { flex-direction: column; align-items: flex-start; gap: 34px; }
      h1 { font-size: clamp(65px, 15vw, 96px); }
      .explore { width: 112px; flex-basis: auto; padding: 16px; font-size: 13px; align-self: flex-end; }
      .hero-caption { margin-top: 24px; font-size: 9px; letter-spacing: .07em; }
      .hero-caption span:last-child { text-align: right; max-width: 180px; }
      .work { padding-top: 52px; padding-bottom: 56px; }
      .work-heading { margin-bottom: 24px; }
      figcaption { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { .explore { transition: none; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#work">Skip to selected work</a>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <img class="hero-image" src="assets/poster.svg" alt="" width="960" height="540" fetchpriority="high">
      <div class="hero-top">
        <p>An independent film practice.</p>
        <span class="frame-number">FRAME 001</span>
      </div>
      <div class="hero-content">
        <div class="hero-row">
          <h1 id="hero-title">A quiet <span>study.</span></h1>
          <a class="explore" href="#work">
            <span>Explore</span>
            <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 5v22M6 17l10 10 10-10" stroke="currentColor" stroke-width="1.5"/></svg>
          </a>
        </div>
        <p class="hero-caption"><span>A study in stillness</span><span>Static poster · Film footage unavailable</span></p>
      </div>
    </section>
    <section class="work" id="work" aria-labelledby="work-title">
      <div class="work-heading"><h2 id="work-title">Selected work</h2><span class="section-number">01 / 01</span></div>
      <figure>
        <img class="work-image" src="assets/poster.svg" alt="A golden circle above a pale green curved landscape against a deep teal sky." width="960" height="540" loading="lazy">
        <figcaption><span>Poster study</span><span>Still image</span></figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
