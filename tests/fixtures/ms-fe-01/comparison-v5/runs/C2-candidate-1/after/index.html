<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FIELD NOTES</title>
  <style>
    :root{--paper:#f6f3eb;--ink:#163b43;--accent:#bf4e2e;--radius:0px;--font:system-ui}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:18px var(--font)}
    header,section{padding:32px}
    a,button{border-radius:var(--radius);font-family:var(--font)}
    .cta{display:inline-block;background:var(--ink);color:var(--paper);padding:16px}
    a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    [hidden]{display:none!important}
    header{display:flex;align-items:center;gap:32px;max-width:1600px;margin:auto;border-bottom:1px solid color-mix(in srgb,var(--ink) 24%,transparent)}
    header span{margin-right:auto;font-size:15px;font-weight:750;letter-spacing:.16em}
    main{max-width:1600px;margin:auto}
    #intro{padding-top:64px;padding-bottom:0}
    .intro-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(240px,1fr);column-gap:48px;align-items:end;margin-bottom:48px}
    .eyebrow{grid-column:1/-1;margin:0 0 28px;font-size:12px;font-weight:650;letter-spacing:.16em;color:var(--accent)}
    h1{margin:0;max-width:15ch;font-size:clamp(60px,7.8vw,120px);font-weight:450;line-height:1.02;letter-spacing:-.065em;text-wrap:balance}
    .intro-aside{padding-bottom:6px}
    .intro-aside p{max-width:25ch;margin:0 0 28px;line-height:1.55}
    .film{position:relative;background:var(--ink);aspect-ratio:2.2;overflow:hidden}
    .film-visual{position:absolute;inset:0}
    .film img,.film video{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;object-position:70% 50%}
    .film::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 16%,transparent)}
    .media-toggle{position:absolute;right:20px;bottom:20px;z-index:1;cursor:pointer}
    .media-toggle svg{display:block;width:16px;height:16px;margin:5px}
    .media-toggle:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    #work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;padding-top:72px;padding-bottom:96px}
    h2{margin:0;font-size:clamp(32px,3vw,46px);font-weight:450;line-height:1.1;letter-spacing:-.045em}
    .work-entry{border-top:1px solid var(--ink);padding-top:20px}
    .work-title{margin:0 0 24px;font-size:24px;letter-spacing:-.025em}
    #detail{margin:24px 0 0;line-height:1.55}
    @media(min-width:1100px){header{padding-left:56px;padding-right:56px}section{padding-left:56px;padding-right:56px}}
    @media(max-width:900px){.intro-grid{grid-template-columns:1fr;gap:28px}.eyebrow{margin:0}h1{max-width:16ch;font-size:clamp(60px,10vw,90px)}.intro-aside{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0}.intro-aside p{margin:0;max-width:28ch}.cta{flex-shrink:0}.film{aspect-ratio:16/9}}
    @media(max-width:540px){header,section{padding:24px}header{gap:20px}header span{font-size:12px;letter-spacing:.12em}#intro{padding-top:40px}.intro-grid{margin-bottom:32px;gap:24px}.eyebrow{font-size:10px}h1{font-size:clamp(48px,12vw,64px);letter-spacing:-.06em}.intro-aside{display:block}.intro-aside p{margin-bottom:24px;max-width:27ch}.film{aspect-ratio:4/3}.film img,.film video{object-position:70% 50%}.media-toggle{right:12px;bottom:12px}#work{grid-template-columns:1fr;gap:28px;padding-top:48px;padding-bottom:56px}.work-title{font-size:22px}}
    @media(prefers-reduced-motion:reduce){.film video{display:none!important}}
  </style>
</head>
<body>
  <header><span>FIELD NOTES</span> <a href="#work">Work</a> <a href="mailto:studio@example.test">Contact</a></header>
  <main>
    <section id="intro">
      <div class="intro-grid">
        <p class="eyebrow" data-enter>INDEPENDENT FILM / 2026</p>
        <h1 data-enter data-delay="70">Make room for the moving world.</h1>
        <div class="intro-aside">
          <p data-enter data-delay="140">Thoughtful films, clear stories, lasting places.</p>
          <a class="cta" id="explore" href="#work" data-track="explore">Explore the work</a>
        </div>
      </div>
      <div class="film" data-media>
        <div class="film-visual" aria-hidden="true">
          <img src="assets/poster.svg" alt="" width="960" height="540" fetchpriority="high">
          <video src="assets/scene.webm" poster="assets/poster.svg" muted playsinline preload="metadata" aria-hidden="true" hidden></video>
        </div>
        <button class="media-toggle" type="button" data-pause aria-label="Play background video" hidden>
          <svg data-play viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2 14 8 4 14Z"/></svg>
          <svg data-stop viewBox="0 0 16 16" aria-hidden="true" hidden><path fill="currentColor" d="M3 2h4v12H3zm6 0h4v12H9z"/></svg>
        </button>
      </div>
    </section>
    <section id="work">
      <h2 data-reveal>Selected work</h2>
      <div class="work-entry">
        <p class="work-title" data-reveal data-delay="80">Tidal study / 2026</p>
        <button id="details" type="button">Show details</button>
        <p id="detail" hidden>Filmed on the northern coast.</p>
      </div>
    </section>
  </main>
  <script>window.analytics=[];document.querySelector('[data-track]').addEventListener('click',()=>window.analytics.push('explore'));document.querySelector('#details').addEventListener('click',()=>{document.querySelector('#detail').hidden=!document.querySelector('#detail').hidden});</script>
  <script>
    // Enhancements leave the document visible when APIs or initialization fail.
    (() => {
      if (!window.matchMedia) return;
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      const controller = new AbortController();
      const options = { signal: controller.signal };
      const animations = new Set();
      let revealObserver, mediaObserver, dead = false;
      const cancelMotion = () => {
        revealObserver?.disconnect();
        animations.forEach(animation => animation.cancel());
        animations.clear();
      };
      const enter = element => {
        if (dead || reduce.matches || !element.animate ||
            element.matches('a,button,input,select,textarea,[tabindex]') ||
            element.querySelector('a,button,input,select,textarea,[tabindex]')) return;
        const animation = element.animate([
          { opacity: .75, transform: 'translateY(14px)' },
          { opacity: 1, transform: 'none' }
        ], { duration: 600, delay: Math.min(160, Math.max(0, Number(element.dataset.delay) || 0)), easing: 'cubic-bezier(.22,1,.36,1)' });
        animations.add(animation);
        animation.finished.then(() => animations.delete(animation), () => animations.delete(animation));
      };
      try {
        if (!reduce.matches) {
          document.querySelectorAll('[data-enter]').forEach(enter);
          const pending = new Set(document.querySelectorAll('[data-reveal]'));
          if (pending.size && 'IntersectionObserver' in window) {
            revealObserver = new IntersectionObserver(entries => {
              entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                revealObserver.unobserve(entry.target);
                pending.delete(entry.target);
                enter(entry.target);
              });
              if (!pending.size) revealObserver.disconnect();
            }, { threshold: 0 });
            pending.forEach(element => revealObserver.observe(element));
          }
        }
        reduce.addEventListener('change', cancelMotion, options);
      } catch { cancelMotion(); }

      const root = document.querySelector('[data-media]');
      const video = root.querySelector('video');
      const button = root.querySelector('[data-pause]');
      let visible = false, userPaused = false, blocked = false, epoch = 0;
      const setPlaying = playing => {
        button.setAttribute('aria-label', playing ? 'Pause background video' : 'Play background video');
        button.querySelector('[data-play]').hidden = playing;
        button.querySelector('[data-stop]').hidden = !playing;
      };
      const still = () => {
        epoch++;
        video.pause();
        video.hidden = true;
        setPlaying(false);
      };
      const sync = async () => {
        button.hidden = reduce.matches || !('IntersectionObserver' in window);
        if (dead || !visible || userPaused || blocked || reduce.matches || document.hidden) {
          still();
          return;
        }
        const attempt = ++epoch;
        try {
          await video.play();
          if (attempt !== epoch) return;
          video.hidden = false;
          setPlaying(true);
        } catch {
          if (attempt !== epoch) return;
          blocked = true;
          still();
        }
      };
      try {
        video.muted = true;
        video.playsInline = true;
        video.loop = true;
        button.addEventListener('click', () => {
          userPaused = !video.paused;
          blocked = false;
          sync();
        }, options);
        video.addEventListener('error', () => { blocked = true; still(); }, options);
        reduce.addEventListener('change', sync, options);
        document.addEventListener('visibilitychange', sync, options);
        if ('IntersectionObserver' in window) {
          mediaObserver = new IntersectionObserver(([entry]) => {
            visible = entry.isIntersecting && entry.intersectionRatio > 0;
            sync();
          }, { threshold: [0, .001] });
          mediaObserver.observe(root);
        }
      } catch { still(); button.hidden = true; }
      const cleanup = () => {
        dead = true;
        cancelMotion();
        mediaObserver?.disconnect();
        still();
        button.hidden = true;
        controller.abort();
      };
      // Teardown leaves a static poster if the document is restored from bfcache.
      window.addEventListener('pagehide', cleanup, { once: true });
    })();
  </script>
</body>
</html>
