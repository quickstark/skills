<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Operations</title>
  <style>
    :root {
      --background: #f6f3eb;
      --text: #163b43;
      --separator: color-mix(in srgb, var(--text) 20%, transparent);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 16px/1.5 system-ui;
    }

    main {
      width: 100%;
      max-width: 960px;
      margin-inline: auto;
      padding: 48px 32px;
    }

    h1 {
      margin: 0 0 32px;
      font-size: 2rem;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px 24px;
      margin-bottom: 24px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
    }

    select {
      min-width: 128px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--text);
      border-radius: 0;
      background: var(--background);
      color: var(--text);
      font: inherit;
    }

    select:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    #count {
      margin: 0;
      font-variant-numeric: tabular-nums;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: left;
    }

    th, td {
      padding: 16px 12px;
      border-bottom: 1px solid var(--separator);
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    th {
      border-top: 1px solid var(--separator);
      font-weight: 600;
    }

    th:first-child, td:first-child { padding-left: 0; }
    th:last-child, td:last-child { padding-right: 0; }
    th:first-child { width: 65%; }

    @media (max-width: 600px) {
      main { padding: 32px 16px; }
      h1 { margin-bottom: 24px; }
      .toolbar { margin-bottom: 20px; }
      th:first-child { width: 60%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Operations</h1>
    <div class="toolbar">
      <label>Status <select id="filter"><option>All</option><option>Ready</option></select></label>
      <p id="count" role="status" aria-live="polite" aria-atomic="true">2 projects</p>
    </div>
    <table>
      <thead>
        <tr><th scope="col">Project</th><th scope="col">Status</th></tr>
      </thead>
      <tbody>
        <tr data-row><td>Tidal</td><td>Ready</td></tr>
        <tr data-row><td>Mountain</td><td>Pending</td></tr>
      </tbody>
    </table>
  </main>
  <script>
    const filter = document.getElementById('filter');
    filter.onchange = () => {
      let count = 0;
      document.querySelectorAll('[data-row]').forEach(r => {
        r.hidden = filter.value !== 'All' && !r.textContent.includes(filter.value);
        if (!r.hidden) count++;
      });
      document.querySelector('#count').textContent = count + ' projects';
    };
  </script>
</body>
</html>
