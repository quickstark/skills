<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f3eb">
    <title>FIELD NOTES — A quiet study.</title>
    <style>
      :root {
        --paper: #f6f3eb;
        --ink: #163b43;
        --ochre: #f1b85b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      .page {
        width: calc(100% - 128px);
        max-width: 1072px;
        margin-inline: auto;
        padding-top: 52px;
        padding-bottom: 44px;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        min-height: 24px;
      }

      .wordmark { font-size: 20px; line-height: 24px; }

      a { color: inherit; text-decoration: none; }

      .work-link {
        margin-right: 35px;
        font-size: 18px;
        line-height: 24px;
      }

      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 6px;
      }

      .hero { margin-top: 103px; }

      h1 {
        margin: 0;
        font-size: 72px;
        font-weight: 400;
        line-height: 1;
      }

      .intro {
        margin: 29px 0 0;
        font-size: 24px;
        line-height: 1;
      }

      .explore {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 160px;
        height: 60px;
        margin-top: 36px;
        background: var(--ink);
        color: var(--paper);
        font-size: 22px;
        line-height: 1;
      }

      .artwork {
        position: relative;
        height: 300px;
        margin-top: 60px;
        overflow: hidden;
        background: var(--ink);
      }

      .artwork::after {
        content: "";
        position: absolute;
        top: 50%;
        right: 10.8208955%;
        width: 180px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--ochre);
        transform: translateY(-50%);
      }

      #work { margin-top: 60px; }

      h2 {
        margin: 0;
        font-size: 36px;
        font-weight: 400;
        line-height: 1;
      }

      @media (max-width: 800px) {
        .page { width: calc(100% - 64px); padding-top: 36px; }
        .work-link { margin-right: 0; }
        .hero { margin-top: 88px; }
        h1 { font-size: clamp(40px, 6vw, 72px); }
        .intro { line-height: 1.4; }
        .artwork { height: clamp(180px, 25vw, 300px); }
        .artwork::after { width: clamp(80px, 15vw, 180px); }
      }

      @media (max-width: 480px) {
        .page { width: calc(100% - 48px); padding-top: 28px; }
        .wordmark { font-size: 18px; }
        .hero { margin-top: 72px; }
        .intro { margin-top: 24px; font-size: 20px; }
        .explore { margin-top: 30px; }
        .artwork { margin-top: 48px; }
        #work { margin-top: 48px; }
        h2 { font-size: 32px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <span class="wordmark">FIELD NOTES</span>
        <nav aria-label="Main navigation"><a class="work-link" href="#work">Work</a></nav>
      </header>
      <main>
        <section class="hero" aria-labelledby="intro-heading">
          <h1 id="intro-heading">A quiet study.</h1>
          <p class="intro">An independent film practice.</p>
          <a class="explore" href="#work">Explore</a>
          <div class="artwork" aria-hidden="true"></div>
        </section>
        <section id="work" aria-labelledby="work-heading">
          <h2 id="work-heading">Selected work</h2>
        </section>
      </main>
    </div>
  </body>
</html>
