<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIELD NOTES</title>
  <style>
    :root {
      color-scheme: light;
      background: #f6f3eb;
      color: #163b43;
      font-family: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    header,
    main { padding-inline: clamp(24px, 6vw, 96px); }

    header {
      padding-top: 36px;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: .15em;
    }

    .intro {
      min-height: 78svh;
      padding-block: clamp(96px, 16vh, 180px) 72px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-size: clamp(56px, 9vw, 144px);
      font-weight: 450;
      line-height: 1.04;
      letter-spacing: -.065em;
    }

    p {
      margin: 28px 0 40px;
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.5;
    }

    .explore {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100px;
      height: 100px;
      border: 1px solid #163b43;
      border-radius: 0;
      background: #163b43;
      color: #f6f3eb;
      font-size: 15px;
      font-weight: 550;
      text-decoration: none;
    }

    .explore:hover {
      background: #f6f3eb;
      color: #163b43;
    }

    .explore:focus-visible {
      outline: 2px solid #163b43;
      outline-offset: 5px;
    }

    #work {
      border-top: 1px solid #163b43;
      padding-block: 32px 96px;
      scroll-margin-top: 32px;
    }

    h2 {
      margin: 0;
      font-size: clamp(24px, 3vw, 40px);
      font-weight: 450;
      line-height: 1.2;
      letter-spacing: -.03em;
    }

    @media (max-width: 480px) {
      header { padding-top: 24px; }
      .intro { min-height: 75svh; }
    }
  </style>
</head>
<body>
  <header>FIELD NOTES</header>
  <main>
    <section class="intro" aria-labelledby="intro-heading">
      <h1 id="intro-heading">A quiet study.</h1>
      <p>An independent film practice.</p>
      <a class="explore" href="#work">Explore</a>
    </section>
    <section id="work" aria-labelledby="work-heading">
      <h2 id="work-heading">Selected work</h2>
    </section>
  </main>
</body>
</html>
