<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <title>FIELD NOTES</title>
  <style>
    :root { color-scheme: light; --paper: #f6f3eb; --ink: #163b43; --accent: #bf4e2e; --rule: #c8cec5; }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 24px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; border-radius: 0; }
    a, button { -webkit-tap-highlight-color: transparent; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    [hidden] { display: none !important; }
    ::selection { background: var(--ink); color: var(--paper); }
    .shell { width: min(100% - 96px, 1600px); margin-inline: auto; }
    .site-header { min-height: 112px; display: flex; align-items: center; justify-content: space-between; gap: 32px; border-bottom: 1px solid var(--rule); }
    .wordmark { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 760; letter-spacing: -.045em; white-space: nowrap; }
    .wordmark::before { content: ""; width: 10px; height: 10px; background: var(--accent); }
    nav { display: flex; gap: 36px; }
    nav a { display: grid; align-items: center; min-height: 44px; font-size: 14px; position: relative; }
    nav a::after { position: absolute; content: ""; height: 1px; background: var(--accent); bottom: 7px; left: 0; right: 0; transform: scaleX(0); transform-origin: left; transition: transform 180ms ease; }
    nav a:hover::after, nav a:focus-visible::after { transform: scaleX(1); }
    .hero-intro { display: grid; grid-template-columns: minmax(0, 1fr) 252px; align-items: end; gap: 40px; padding-block: 63px 49px; }
    h1 { max-width: 1030px; margin: 0; font-size: clamp(64px, 7.8vw, 124px); line-height: .99; letter-spacing: -.065em; font-weight: 500; text-wrap: balance; }
    h1 .last-line { color: var(--accent); }
    .hero-detail { padding-bottom: 5px; }
    .hero-detail p { max-width: 240px; margin: 0 0 29px; font-size: 18px; line-height: 1.5; letter-spacing: -.02em; }
    .primary { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 26px; border-bottom: 1px solid var(--accent); color: var(--accent); font-size: 14px; font-weight: 600; }
    .primary svg { width: 22px; height: 22px; flex: none; transition: transform 180ms ease; }
    .primary:hover svg { transform: translate(3px, 3px); }
    .film { position: relative; aspect-ratio: 2.35; overflow: hidden; background: var(--ink); }
    .film img, .film video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 75% 50%; }
    .film img { color: transparent; }
    .motion-control { position: absolute; right: 20px; bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 0 16px; border: 1px solid var(--paper); background: var(--paper); color: var(--ink); cursor: pointer; font-size: 12px; font-weight: 600; }
    .motion-control:hover { background: var(--ink); color: var(--paper); }
    .motion-icon { width: 10px; height: 12px; border-left: 3px solid currentColor; border-right: 3px solid currentColor; }
    .motion-control[data-paused="true"] .motion-icon { width: 0; height: 0; border: 6px solid transparent; border-right: 0; border-left: 9px solid currentColor; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .work { display: grid; grid-template-columns: 1fr 2fr; column-gap: 48px; padding-block: 92px 84px; }
    h2 { margin: 7px 0 30px; font-size: 15px; line-height: 1.5; font-weight: 500; }
    .work-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
    .work-list li { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-block: 27px; border-bottom: 1px solid var(--rule); font-size: clamp(24px, 2.8vw, 42px); letter-spacing: -.045em; line-height: 1.2; }
    .work-list .year { font-size: 14px; letter-spacing: 0; white-space: nowrap; }
    .about { border-top: 1px solid var(--ink); padding-block: 37px 63px; }
    .about p { margin: 0 0 0 auto; width: calc((100% - 48px) * 2 / 3); font-size: clamp(24px, 3.2vw, 46px); line-height: 1.2; letter-spacing: -.04em; max-width: 880px; }
    @media (min-width: 1700px) { .hero-intro { grid-template-columns: minmax(0, 1fr) 280px; } }
    @media (max-width: 1050px) {
      .shell { width: calc(100% - 64px); }
      .site-header { min-height: 96px; }
      .hero-intro { grid-template-columns: minmax(0, 1fr); gap: 32px; padding-block: 48px 36px; }
      h1 { max-width: 850px; font-size: clamp(64px, 9.7vw, 100px); }
      .hero-detail { display: flex; justify-content: space-between; align-items: end; gap: 36px; padding: 0; }
      .hero-detail p { max-width: 280px; margin: 0; }
      .primary { width: 230px; }
      .film { aspect-ratio: 16 / 9; }
      .work { padding-block: 64px; grid-template-columns: 1fr 2fr; gap: 32px; }
      .about p { width: calc((100% - 32px) * 2 / 3); }
    }
    @media (max-width: 600px) {
      .shell { width: calc(100% - 40px); }
      .site-header { min-height: 84px; gap: 16px; }
      .wordmark { font-size: 16px; gap: 8px; }
      .wordmark::before { width: 7px; height: 7px; }
      nav { gap: 16px; }
      nav a { font-size: 12px; }
      .hero-intro { padding-block: 39px 30px; gap: 27px; }
      h1 { max-width: 460px; font-size: clamp(49px, 13.8vw, 76px); line-height: 1.02; letter-spacing: -.06em; text-wrap: initial; }
      .hero-detail { display: block; }
      .hero-detail p { max-width: 260px; font-size: 16px; line-height: 1.5; margin-bottom: 18px; }
      .primary { width: 100%; min-height: 48px; }
      .film { aspect-ratio: 4 / 3; }
      .film img, .film video { object-position: 75% 50%; }
      .motion-control { bottom: 12px; right: 12px; padding-inline: 12px; }
      .work { display: block; padding-block: 45px 48px; }
      h2 { margin: 0 0 22px; }
      .work-list li { padding-block: 23px; font-size: 26px; }
      .work-list .year { font-size: 12px; }
      .about { padding-block: 28px 44px; }
      .about p { width: 100%; max-width: 340px; margin: 0; font-size: 30px; }
    }
    @media (max-height: 500px) and (min-width: 601px) {
      .site-header { min-height: 72px; }
      .hero-intro { padding-block: 30px; gap: 24px; }
      h1 { font-size: clamp(55px, 8vw, 84px); max-width: 880px; }
      .hero-detail p { font-size: 16px; }
      .film { aspect-ratio: 2.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
      .film video, .motion-control { display: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-header shell">
    <div class="wordmark">FIELD NOTES</div>
    <nav aria-label="Main navigation">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="mailto:studio@example.test">Contact</a>
    </nav>
  </header>
  <main class="shell">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-intro">
        <h1 id="hero-title">Make room for the <span class="last-line">moving world.</span></h1>
        <div class="hero-detail">
          <p>Thoughtful films, clear stories, lasting places.</p>
          <a class="primary" href="#work">Explore the work <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5 19 19M5 19h14V5" stroke="currentColor" stroke-width="1.5"/></svg></a>
        </div>
      </div>
      <div class="film" data-media>
        <img src="assets/poster.svg" alt="" width="960" height="540" fetchpriority="high">
        <video src="assets/scene.webm" poster="assets/poster.svg" muted playsinline loop preload="none" aria-hidden="true" hidden></video>
        <button class="motion-control" type="button" data-paused="true" hidden><span class="motion-icon" aria-hidden="true"></span><span data-label>Play motion</span></button>
        <span class="sr-only" role="status" data-status></span>
      </div>
    </section>
    <section class="work" id="work" aria-labelledby="work-title">
      <h2 id="work-title">Selected work</h2>
      <ul class="work-list">
        <li><span>Tidal study</span> <span class="year">/ 2026</span></li>
        <li><span>Mountain light</span> <span class="year">/ 2025</span></li>
      </ul>
    </section>
    <section class="about" id="about" aria-label="About">
      <p>An independent film practice.</p>
    </section>
  </main>
  <script>
    (() => {
      const root = document.querySelector('[data-media]');
      const video = root.querySelector('video');
      const button = root.querySelector('button');
      const label = root.querySelector('[data-label]');
      const status = root.querySelector('[data-status]');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      let visible = false, userPaused = false, blocked = false, disposed = false, epoch = 0;
      let observer;
      const still = () => {
        epoch++;
        video.pause();
        video.hidden = true;
        button.dataset.paused = 'true';
        label.textContent = blocked ? 'Retry motion' : 'Play motion';
      };
      const sync = async () => {
        button.hidden = reduce.matches || !observer;
        if (disposed || !visible || userPaused || blocked || reduce.matches || document.hidden) {
          still();
          return;
        }
        const attempt = ++epoch;
        try {
          await video.play();
          if (attempt !== epoch || disposed) return;
          video.hidden = false;
          button.dataset.paused = 'false';
          label.textContent = 'Pause motion';
          status.textContent = '';
        } catch {
          if (attempt !== epoch || disposed) return;
          blocked = true;
          still();
          status.textContent = 'Static preview. Motion is unavailable.';
        }
      };
      const onClick = () => {
        userPaused = !video.paused;
        blocked = false;
        sync();
      };
      const onError = () => {
        blocked = true;
        still();
        status.textContent = 'Static preview. Motion is unavailable.';
      };
      try {
        if (!('IntersectionObserver' in window) || !video.canPlayType('video/webm')) return;
        video.muted = true;
        observer = new IntersectionObserver(([entry]) => {
          visible = entry.isIntersecting;
          sync();
        }, { threshold: 0 });
        button.addEventListener('click', onClick);
        video.addEventListener('error', onError);
        document.addEventListener('visibilitychange', sync);
        reduce.addEventListener('change', sync);
        observer.observe(root);
        sync();
      } catch {
        still();
        button.hidden = true;
      }
      window.addEventListener('pagehide', () => {
        disposed = true;
        still();
        observer?.disconnect();
        button.removeEventListener('click', onClick);
        video.removeEventListener('error', onError);
        document.removeEventListener('visibilitychange', sync);
        reduce.removeEventListener('change', sync);
      }, { once: true });
      window.addEventListener('pageshow', event => {
        if (event.persisted && disposed) {
          button.hidden = true;
        }
      });
    })();
  </script>
</body>
</html>
