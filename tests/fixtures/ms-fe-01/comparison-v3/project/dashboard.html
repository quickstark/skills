<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations</title><style>body{font:16px system-ui;background:#f6f3eb;color:#163b43}table{width:100%;text-align:left}td,th{padding:12px}</style><h1>Operations</h1><label>Status <select id="filter"><option>All</option><option>Ready</option></select></label><p id="count">2 projects</p><table><tr><th>Project</th><th>Status</th></tr><tr data-row><td>Tidal</td><td>Ready</td></tr><tr data-row><td>Mountain</td><td>Pending</td></tr></table><script>filter.onchange=()=>{let count=0;document.querySelectorAll('[data-row]').forEach(r=>{r.hidden=filter.value!=='All'&&!r.textContent.includes(filter.value);if(!r.hidden)count++});document.querySelector('#count').textContent=count+' projects'};</script></html>
