<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIELD NOTES</title>
<style>
:root{--paper:#f6f3eb;--ink:#163b43;--accent:#bf4e2e;--radius:0px;--font:system-ui}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px var(--font)}
header,section{padding:32px}
a,button{border-radius:var(--radius);font-family:var(--font)}
.cta{display:inline-block;background:var(--ink);color:var(--paper);padding:16px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:clamp(24px,4vw,64px);padding:32px clamp(24px,4.5vw,80px);border-bottom:1px solid var(--ink)}
header span{margin-right:auto;font-size:16px;font-weight:750;letter-spacing:.16em}
header a{color:var(--ink);font-size:15px;text-underline-offset:5px}
section{padding-inline:clamp(24px,4.5vw,80px)}
#intro{display:grid;grid-template-columns:1.08fr 1fr;gap:clamp(32px,5vw,80px);align-items:center;padding-block:64px 96px}
.intro-copy>p:first-child{margin:0 0 32px;color:var(--accent);font-size:12px;font-weight:650;letter-spacing:.16em}
h1{max-width:11ch;margin:0;font-size:clamp(56px,6.7vw,112px);font-weight:500;letter-spacing:-.065em;line-height:1.02;text-wrap:balance}
.intro-copy>p:nth-of-type(2){max-width:28ch;margin:32px 0;font-size:clamp(18px,1.5vw,22px);line-height:1.6}
.cta{text-underline-offset:4px}
.media-column{min-width:0}
.film{position:relative;aspect-ratio:4/5;background:var(--ink);border-block:20px solid var(--ink);overflow:hidden}
.film img,.film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:75% center}
.media-controls{display:flex;justify-content:flex-end;padding-top:12px;min-height:36px}
.media-controls button{cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
#work{display:grid;grid-template-columns:1.08fr 1fr;gap:clamp(32px,5vw,80px);align-items:start;border-top:1px solid var(--ink);padding-block:64px 104px}
h2{margin:0;font-size:clamp(36px,4.2vw,64px);font-weight:500;letter-spacing:-.045em;line-height:1.1}
.work-copy>p:first-child{margin:0 0 28px;font-size:clamp(24px,2.4vw,36px);line-height:1.3;letter-spacing:-.025em}
#detail{margin:24px 0 0;font-size:18px;line-height:1.6}
@media(min-width:1600px){#intro{min-height:calc(100svh - 87px)}.film{max-height:740px;aspect-ratio:auto;height:70vh}}
@media(max-width:900px){#intro{gap:32px;padding-block:48px 64px}h1{font-size:clamp(48px,7vw,64px)}.film{aspect-ratio:3/4}#work{gap:32px;padding-block:48px 72px}}
@media(max-width:600px){header{padding-block:24px;gap:20px}header span{font-size:12px;letter-spacing:.1em}header a{font-size:14px}#intro{grid-template-columns:1fr;gap:40px;padding-block:40px 48px}h1{font-size:clamp(54px,11.5vw,72px);max-width:12ch}.intro-copy>p:first-child{margin-bottom:24px;font-size:11px;letter-spacing:.12em}.intro-copy>p:nth-of-type(2){margin:24px 0;max-width:28ch}.film{aspect-ratio:16/11;border-block-width:14px}#work{grid-template-columns:1fr;gap:32px;padding-block:40px 64px}}
@media(prefers-reduced-motion:reduce){.film video{display:none!important}}
</style>
<header><span>FIELD NOTES</span> <a href="#work">Work</a> <a href="mailto:studio@example.test">Contact</a></header>
<main>
<section id="intro">
  <div class="intro-copy">
    <p data-enter>INDEPENDENT FILM / 2026</p>
    <h1 data-enter data-delay="70">Make room for the moving world.</h1>
    <p data-enter data-delay="140">Thoughtful films, clear stories, lasting places.</p>
    <a class="cta" id="explore" href="#work" data-track="explore">Explore the work</a>
  </div>
  <div class="media-column" data-media>
    <div class="film" data-enter data-delay="100">
      <img src="assets/poster.svg" alt="" width="960" height="540" fetchpriority="high">
      <video src="assets/scene.webm" poster="assets/poster.svg" muted playsinline loop preload="metadata" aria-hidden="true" hidden></video>
    </div>
    <div class="media-controls"><button type="button" data-pause aria-label="Pause background video" hidden><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path data-pause-icon d="M5 3v10M11 3v10" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>
  </div>
</section>
<section id="work">
  <h2 data-reveal>Selected work</h2>
  <div class="work-copy">
    <p data-reveal data-delay="100">Tidal study / 2026</p>
    <button id="details" type="button">Show details</button>
    <p id="detail" hidden>Filmed on the northern coast.</p>
  </div>
</section>
</main>
<script>window.analytics=[];document.querySelector('[data-track]').addEventListener('click',()=>window.analytics.push('explore'));document.querySelector('#details').addEventListener('click',()=>{document.querySelector('#detail').hidden=!document.querySelector('#detail').hidden});</script>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const controller = new AbortController();
  const options = {signal:controller.signal};
  const animations = new Set();
  let reveals, mediaObserver, dead = false;
  const stopMotion = () => {
    reveals?.disconnect();
    animations.forEach(animation => animation.cancel());
    animations.clear();
  };
  const enter = element => {
    if (dead || reduce.matches || !element.animate) return;
    const animation = element.animate([
      {opacity:.75,transform:'translateY(14px)'},
      {opacity:1,transform:'none'}
    ],{duration:550,delay:Math.min(160,Number(element.dataset.delay)||0),easing:'cubic-bezier(.22,1,.36,1)'});
    animations.add(animation);
    animation.finished.then(() => animations.delete(animation),() => animations.delete(animation));
  };
  try {
    if (!reduce.matches) {
      document.querySelectorAll('[data-enter]').forEach(enter);
      const pending = new Set(document.querySelectorAll('[data-reveal]'));
      if ('IntersectionObserver' in window) {
        reveals = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            reveals.unobserve(entry.target);
            pending.delete(entry.target);
            enter(entry.target);
          });
          if (!pending.size) reveals.disconnect();
        },{threshold:0});
        pending.forEach(element => reveals.observe(element));
      }
    }
    reduce.addEventListener('change',stopMotion,options);
  } catch { stopMotion(); }

  const root = document.querySelector('[data-media]');
  const video = root.querySelector('video');
  const button = root.querySelector('[data-pause]');
  const icon = root.querySelector('[data-pause-icon]');
  let visible = false, userPaused = false, blocked = false, epoch = 0;
  const still = () => {
    epoch++;
    video.pause();
    video.hidden = true;
    button.setAttribute('aria-label','Play background video');
    icon.setAttribute('d','M5 3l7 5-7 5Z');
  };
  const sync = async () => {
    button.hidden = reduce.matches || dead;
    if (dead || !visible || userPaused || blocked || reduce.matches || document.hidden) {
      still();
      return;
    }
    const attempt = ++epoch;
    try {
      await video.play();
      if (attempt !== epoch) return;
      video.hidden = false;
      button.setAttribute('aria-label','Pause background video');
      icon.setAttribute('d','M5 3v10M11 3v10');
    } catch {
      if (attempt !== epoch) return;
      blocked = true;
      still();
    }
  };
  try {
    video.muted = true;
    if ('IntersectionObserver' in window) {
      button.hidden = reduce.matches;
      mediaObserver = new IntersectionObserver(([entry]) => {
        visible = entry.isIntersecting && entry.intersectionRatio > 0;
        sync();
      },{threshold:[0,.001]});
      mediaObserver.observe(root);
      button.addEventListener('click',() => {
        userPaused = !video.paused;
        blocked = false;
        sync();
      },options);
      reduce.addEventListener('change',sync,options);
      document.addEventListener('visibilitychange',sync,options);
      video.addEventListener('error',() => {blocked = true;still();},options);
    }
  } catch { still();button.hidden = true; }
  const teardown = () => {
    dead = true;
    stopMotion();
    mediaObserver?.disconnect();
    still();
    button.hidden = true;
    controller.abort();
  };
  window.addEventListener('pagehide',event => {if (!event.persisted) teardown();},options);
})();
</script>
</html>
