<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIELD NOTES</title>
<style>
:root{--paper:#f6f3eb;--ink:#163b43;--accent:#bf4e2e;--radius:0px;--font:system-ui}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px var(--font)}
header,section{padding:32px}
a,button{border-radius:var(--radius);font-family:var(--font)}
.cta{display:inline-block;background:var(--ink);color:var(--paper);padding:16px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
header{display:flex;align-items:center;gap:32px;max-width:1600px;margin:auto;padding-block:28px;border-bottom:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
header span{margin-right:auto;font-size:17px;font-weight:750;letter-spacing:.16em}
header a{color:var(--ink);font-size:14px;text-underline-offset:5px}
main{max-width:1600px;margin:auto}
#intro{padding-top:64px;padding-bottom:72px}
.intro-label{margin:0 0 24px;color:var(--accent);font-size:12px;font-weight:650;letter-spacing:.16em}
.intro-heading{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(230px,1fr);align-items:end;gap:clamp(32px,6vw,100px);margin-bottom:44px}
h1{max-width:14ch;margin:0;font-size:clamp(54px,6.6vw,100px);font-weight:500;line-height:1.01;letter-spacing:-.065em;text-wrap:balance}
.intro-summary{padding-bottom:4px}
.intro-summary p{max-width:25ch;margin:0 0 28px;font-size:clamp(18px,1.6vw,23px);line-height:1.5;letter-spacing:-.025em}
.film{position:relative;overflow:hidden;aspect-ratio:2.2;background:var(--ink);isolation:isolate}
.film img,.film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 56%}
.film video{z-index:1}
.film::after{position:absolute;inset:0;z-index:2;content:"";pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.08),transparent 40%,rgba(0,0,0,.15));box-shadow:inset 0 0 80px rgba(0,0,0,.1)}
#work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.8fr);gap:clamp(32px,6vw,100px);align-items:start;border-top:1px solid color-mix(in srgb,var(--ink) 22%,transparent);padding-top:48px;padding-bottom:80px;scroll-margin-top:24px}
h2{margin:0 0 40px;font-size:clamp(32px,3.2vw,48px);line-height:1.1;font-weight:500;letter-spacing:-.045em}
.work-copy>p{margin:0 0 22px;font-size:16px;line-height:1.6}
.work-copy #detail{margin-top:22px;max-width:27ch}
.work-visual{margin:0;overflow:hidden;aspect-ratio:16/9;background:var(--ink)}
.work-visual img{display:block;width:100%;height:100%;object-fit:cover}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes frame-enter{from{opacity:0;clip-path:inset(6% 0 0 0)}to{opacity:1;clip-path:inset(0)}}
@media(prefers-reduced-motion:no-preference){
header{animation:enter .65s both}
.intro-label{animation:enter .65s .08s both}
h1{animation:enter .8s .15s both}
.intro-summary{animation:enter .8s .25s both}
.film{animation:frame-enter 1s .2s both}
.motion-ready [data-reveal]{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.motion-ready [data-reveal].is-visible{opacity:1;transform:none}
.motion-ready .work-visual img{transform:scale(1.045);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.motion-ready .work-visual.is-visible img{transform:scale(1)}
}
@media(min-width:1100px){header,section{padding-inline:clamp(40px,4vw,64px)}}
@media(max-width:700px){
header{padding:24px 20px;gap:20px}
header span{font-size:13px;letter-spacing:.12em}
header a{font-size:13px}
section{padding-inline:20px}
#intro{padding-top:40px;padding-bottom:44px}
.intro-label{font-size:10px;margin-bottom:22px}
.intro-heading{grid-template-columns:1fr;gap:26px;margin-bottom:32px}
h1{max-width:13ch;font-size:clamp(46px,10vw,68px);letter-spacing:-.06em}
.intro-summary{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0}
.intro-summary p{font-size:16px;max-width:21ch;margin:0}
.cta{flex-shrink:0}
.film{aspect-ratio:4/3}
.film img,.film video{object-position:65% 50%}
#work{grid-template-columns:1fr;gap:30px;padding-top:32px;padding-bottom:48px}
h2{margin-bottom:24px}
}
@media(max-width:420px){.intro-summary{display:block}.intro-summary p{max-width:26ch;margin-bottom:24px}}
@media(prefers-reduced-motion:reduce){.film video{display:none}}
</style>
</head>
<body>
<header><span>FIELD NOTES</span> <a href="#work">Work</a> <a href="mailto:studio@example.test">Contact</a></header>
<main>
<section id="intro">
<p class="intro-label">INDEPENDENT FILM / 2026</p>
<div class="intro-heading">
<h1>Make room for the moving world.</h1>
<div class="intro-summary">
<p>Thoughtful films, clear stories, lasting places.</p>
<a class="cta" id="explore" href="#work" data-track="explore">Explore the work</a>
</div>
</div>
<div class="film" aria-hidden="true">
<img src="assets/poster.svg" alt="" width="960" height="540" fetchpriority="high">
<video muted playsinline preload="none" poster="assets/poster.svg" tabindex="-1">
<source src="assets/scene.webm" type="video/webm">
</video>
</div>
</section>
<section id="work">
<div class="work-copy" data-reveal>
<h2>Selected work</h2>
<p>Tidal study / 2026</p>
<button id="details" type="button">Show details</button>
<p id="detail" hidden>Filmed on the northern coast.</p>
</div>
<div class="work-visual" data-reveal aria-hidden="true"><img src="assets/poster.svg" alt="" width="960" height="540" loading="lazy"></div>
</section>
</main>
<script>window.analytics=[];document.querySelector('[data-track]').addEventListener('click',()=>window.analytics.push('explore'));document.querySelector('#details').addEventListener('click',()=>{document.querySelector('#detail').hidden=!document.querySelector('#detail').hidden});</script>
<script>
(() => {
  const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
  const video = document.querySelector('video');
  let revealObserver;
  let filmObserver;
  let stopTimer;
  let started = false;
  let filmVisible = false;

  function stopFilm() {
    video.pause();
    clearTimeout(stopTimer);
  }

  function configureMotion() {
    stopFilm();
    revealObserver?.disconnect();
    filmObserver?.disconnect();
    document.documentElement.classList.remove('motion-ready');
    if (preference.matches || !('IntersectionObserver' in window)) return;

    const reveals = document.querySelectorAll('[data-reveal]');
    revealObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        revealObserver.unobserve(entry.target);
      });
    }, { threshold: 0.12 });
    document.documentElement.classList.add('motion-ready');
    reveals.forEach(element => revealObserver.observe(element));

    filmObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        filmVisible = entry.isIntersecting;
        if (!filmVisible) {
          stopFilm();
          return;
        }
        if (started || document.hidden) return;
        started = true;
        video.muted = true;
        const playback = video.play();
        if (playback) playback.then(() => {
          if (preference.matches || document.hidden || !filmVisible) return stopFilm();
          stopTimer = setTimeout(stopFilm, 4500);
        }).catch(() => { /* The local poster remains visible if playback is unavailable. */ });
      });
    }, { threshold: 0.25 });
    filmObserver.observe(video);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopFilm();
  });
  preference.addEventListener('change', configureMotion);
  configureMotion();
})();
</script>
</body>
</html>
