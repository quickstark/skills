<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Operations</title>
  <style>
    :root {
      --background: #f6f3eb;
      --foreground: #163b43;
      --space: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font: 16px/1.5 system-ui;
    }

    main {
      width: 100%;
      max-width: 1008px;
      margin-inline: auto;
      padding: 48px 24px;
    }

    h1 {
      margin: 0 0 36px;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space) 24px;
      margin-bottom: 24px;
    }

    label {
      display: flex;
      align-items: center;
      gap: var(--space);
    }

    select {
      min-width: 132px;
      min-height: 44px;
      padding: 8px var(--space);
      border: 1px solid rgb(22 59 67 / 45%);
      border-radius: 0;
      background: var(--background);
      color: var(--foreground);
      font: inherit;
      cursor: pointer;
    }

    select:focus-visible {
      outline: 2px solid var(--foreground);
      outline-offset: 3px;
    }

    #count { margin: 0; }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: left;
    }

    th, td {
      padding: 18px var(--space);
      vertical-align: top;
      overflow-wrap: anywhere;
      border-bottom: 1px solid rgb(22 59 67 / 18%);
    }

    th {
      padding-top: var(--space);
      padding-bottom: var(--space);
      font-weight: 600;
      border-bottom-color: rgb(22 59 67 / 45%);
    }

    th:first-child, td:first-child { width: 65%; padding-left: 0; }
    th:last-child, td:last-child { padding-right: 0; }

    @media (max-width: 480px) {
      main { padding: 24px; }
      h1 { margin-bottom: 24px; }
      .toolbar { align-items: flex-start; }
      #count { align-self: center; }
      th:first-child, td:first-child { width: 60%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Operations</h1>
    <div class="toolbar">
      <label>Status
        <select id="filter">
          <option>All</option>
          <option>Ready</option>
        </select>
      </label>
      <p id="count" role="status" aria-live="polite">2 projects</p>
    </div>
    <table aria-label="Projects">
      <thead>
        <tr><th scope="col">Project</th><th scope="col">Status</th></tr>
      </thead>
      <tbody>
        <tr data-row><td>Tidal</td><td>Ready</td></tr>
        <tr data-row><td>Mountain</td><td>Pending</td></tr>
      </tbody>
    </table>
  </main>
  <script>filter.onchange=()=>{let count=0;document.querySelectorAll('[data-row]').forEach(r=>{r.hidden=filter.value!=='All'&&!r.textContent.includes(filter.value);if(!r.hidden)count++});document.querySelector('#count').textContent=count+' projects'};</script>
</body>
</html>
