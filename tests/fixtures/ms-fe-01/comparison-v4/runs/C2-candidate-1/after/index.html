<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIELD NOTES</title>
<style>
:root{--paper:#f6f3eb;--ink:#163b43;--accent:#bf4e2e;--radius:0px;--font:system-ui}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:18px var(--font)}
header,section{padding:32px}
a,button{border-radius:var(--radius);font-family:var(--font)}
a{color:inherit;text-underline-offset:5px}
.cta{display:inline-block;background:var(--ink);color:var(--paper);padding:16px}
a:focus-visible,button:focus-visible,video:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;max-width:1600px;margin:auto;padding:30px clamp(24px,4.5vw,72px);border-bottom:1px solid var(--ink)}
header>span{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:750;letter-spacing:.12em;white-space:nowrap}
header>span::before{content:"";width:11px;height:11px;background:var(--accent)}
nav{display:flex;gap:clamp(20px,3vw,48px);font-size:14px}
nav a{text-decoration:none;padding-block:8px}
nav a:hover{text-decoration:underline}
main{max-width:1600px;margin:auto}
section{padding:clamp(32px,4.5vw,72px)}
#intro{padding-top:40px;padding-bottom:0}
.intro-copy{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.35fr);column-gap:clamp(32px,5vw,80px);align-items:end}
.eyebrow{grid-column:1/-1;margin:0 0 24px;font-size:12px;font-weight:650;letter-spacing:.16em;line-height:1.5;color:var(--accent)}
h1{max-width:16ch;margin:0;font-size:clamp(52px,7.2vw,108px);font-weight:500;line-height:1.02;letter-spacing:-.065em;text-wrap:balance}
.intro-side{padding-bottom:6px}
.intro-side p{max-width:25ch;margin:0 0 28px;font-size:clamp(17px,1.4vw,20px);line-height:1.55}
.cta{font-size:14px;text-decoration:none;line-height:1.5}
.cta:hover{text-decoration:underline;text-underline-offset:4px}
.media{position:relative;isolation:isolate;aspect-ratio:2.2;margin-top:48px;overflow:hidden;background:var(--ink)}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 50%}
.media img{z-index:-1}
.media video{display:block}
#work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;padding-top:64px;padding-bottom:96px}
h2{margin:0;font-size:clamp(32px,3.5vw,52px);line-height:1.1;letter-spacing:-.045em;font-weight:500}
.work-item{border-top:1px solid var(--ink);padding-top:22px}
.work-title{margin:0 0 32px;font-size:clamp(24px,2.5vw,36px);line-height:1.25;letter-spacing:-.035em}
button{font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--ink);padding:16px;line-height:1.5;cursor:pointer}
button:hover{text-decoration:underline;text-underline-offset:4px}
#detail{margin:24px 0 0;max-width:36ch;font-size:16px;line-height:1.6}
@media(min-width:1600px){header{border-inline:1px solid var(--ink)}}
@media(max-width:900px){
 .intro-copy{grid-template-columns:1fr}
 h1{max-width:17ch;font-size:clamp(52px,9.5vw,84px)}
 .intro-side{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:28px;padding:0}
 .intro-side p{margin:0;max-width:30ch}
 .cta{flex-shrink:0}
 .media{margin-top:32px;aspect-ratio:16/9}
 #work{padding-top:44px;padding-bottom:64px}
}
@media(max-width:540px){
 header{padding:20px 24px;gap:16px}
 header>span{gap:8px;font-size:12px;letter-spacing:.09em}
 nav{gap:18px;font-size:12px}
 section{padding:32px 24px}
 #intro{padding-top:30px}
 .eyebrow{font-size:10px;margin-bottom:20px;letter-spacing:.13em}
 h1{font-size:clamp(42px,12.5vw,66px);letter-spacing:-.06em;line-height:1.04}
 .intro-side{display:block;margin-top:24px}
 .intro-side p{max-width:27ch;margin-bottom:20px;font-size:17px}
 .media{margin-top:28px}
 #work{grid-template-columns:1fr;gap:28px;padding-top:36px;padding-bottom:48px}
 .work-title{margin-bottom:24px}
}
</style>
</head>
<body>
<header><span>FIELD NOTES</span><nav aria-label="FIELD NOTES"><a href="#work">Work</a><a href="mailto:studio@example.test">Contact</a></nav></header>
<main>
<section id="intro">
 <div class="intro-copy">
  <p class="eyebrow" data-enter>INDEPENDENT FILM / 2026</p>
  <h1 data-enter data-delay="80">Make room for the moving world.</h1>
  <div class="intro-side">
   <p data-enter data-delay="160">Thoughtful films, clear stories, lasting places.</p>
   <a class="cta" id="explore" href="#work" data-track="explore">Explore the work</a>
  </div>
 </div>
 <div class="media" data-media>
  <img src="assets/poster.svg" alt="" width="960" height="540">
  <video controls muted playsinline loop preload="metadata" poster="assets/poster.svg" aria-label="INDEPENDENT FILM / 2026" width="960" height="540">
   <source src="assets/scene.webm" type="video/webm">
  </video>
 </div>
</section>
<section id="work">
 <h2 data-reveal>Selected work</h2>
 <div class="work-item">
  <p class="work-title" data-reveal data-delay="100">Tidal study / 2026</p>
  <button id="details" type="button">Show details</button>
  <p id="detail" hidden>Filmed on the northern coast.</p>
 </div>
</section>
</main>
<script>window.analytics=[];document.querySelector('[data-track]').addEventListener('click',()=>window.analytics.push('explore'));document.querySelector('#details').addEventListener('click',()=>{document.querySelector('#detail').hidden=!document.querySelector('#detail').hidden});</script>
<script>
// Enhancements leave ordinary content and the poster available without JavaScript.
function mountMotion() {
 const reduce = matchMedia('(prefers-reduced-motion: reduce)');
 const active = new Set();
 let observer, stopped = reduce.matches;
 const finish = () => {
  stopped = true;
  observer?.disconnect();
  active.forEach(animation => animation.cancel());
  active.clear();
 };
 const animate = element => {
  if (stopped || element.dataset.entered || !element.animate) return;
  element.dataset.entered = 'true';
  const animation = element.animate([
   {opacity:.75,transform:'translateY(14px)'},
   {opacity:1,transform:'none'}
  ], {duration:600,delay:Math.min(160,Number(element.dataset.delay)||0),easing:'cubic-bezier(.22,1,.36,1)'});
  active.add(animation);
  animation.finished.then(()=>active.delete(animation),()=>active.delete(animation));
 };
 try {
  document.querySelectorAll('[data-enter]').forEach(animate);
  const pending = new Set(document.querySelectorAll('[data-reveal]'));
  if (!stopped && 'IntersectionObserver' in window) {
   observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
     if (!entry.isIntersecting) return;
     observer.unobserve(entry.target);
     pending.delete(entry.target);
     animate(entry.target);
    });
    if (!pending.size) observer.disconnect();
   }, {threshold:0});
   pending.forEach(element => observer.observe(element));
  }
  reduce.addEventListener('change',finish);
 } catch { finish(); }
 return () => { finish(); reduce.removeEventListener('change',finish); };
}
function mountMedia() {
 const video = document.querySelector('[data-media] video');
 const source = video.querySelector('source');
 const reduce = matchMedia('(prefers-reduced-motion: reduce)');
 const controller = new AbortController();
 const options = {signal:controller.signal};
 let observer, visible = false, userPaused = false, blocked = false, dead = false;
 const eligible = () => !dead && visible && !document.hidden && !reduce.matches && !userPaused && !blocked;
 const sync = () => {
  video.hidden = reduce.matches || blocked;
  if (!eligible()) { video.pause(); return; }
  video.play().then(() => {
   if (!eligible()) video.pause();
  }).catch(() => {
   // Rejected autoplay leaves the native play control available for a retry.
   if (!dead && visible && !document.hidden && !reduce.matches) userPaused = true;
  });
 };
 const fail = () => { blocked = true; sync(); };
 try {
  video.muted = true;
  video.addEventListener('pause',() => {
   if (!dead && visible && !document.hidden && !reduce.matches && !blocked) userPaused = true;
  },options);
  video.addEventListener('play',() => {
   userPaused = false;
   if (dead || !visible || document.hidden || reduce.matches || blocked) video.pause();
  },options);
  video.addEventListener('error',fail,options);
  source.addEventListener('error',fail,options);
  document.addEventListener('visibilitychange',sync,options);
  reduce.addEventListener('change',sync,options);
  sync();
  if ('IntersectionObserver' in window) {
   observer = new IntersectionObserver(([entry]) => {
    visible = entry.isIntersecting && entry.intersectionRatio > 0;
    sync();
   }, {threshold:[0,.001]});
   observer.observe(video.parentElement);
  } else {
   // Without observation, retain a static native player with deliberate playback.
   visible = true;
  }
  if (video.error) fail();
 } catch { blocked = true; video.hidden = true; video.pause(); }
 return () => {
  dead = true;
  observer?.disconnect();
  controller.abort();
  video.pause();
 };
}
let cleanups = [];
function mountEnhancements() {
 try { cleanups.push(mountMotion()); } catch {}
 try { cleanups.push(mountMedia()); } catch {}
}
mountEnhancements();
window.addEventListener('pagehide',() => { cleanups.forEach(cleanup=>cleanup()); cleanups=[]; });
window.addEventListener('pageshow',event => { if (event.persisted) mountEnhancements(); });
</script>
</body>
</html>
