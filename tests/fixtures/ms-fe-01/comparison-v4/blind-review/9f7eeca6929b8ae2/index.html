<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <title>FIELD NOTES</title>
  <style>
    :root { color-scheme: light; --paper: #f6f3eb; --ink: #163b43; --accent: #bf4e2e; --rule: #163b4333; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; scroll-padding-top: 28px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    ::selection { color: var(--paper); background: var(--accent); }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 5px; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
    .shell { width: min(100% - 112px, 1600px); margin-inline: auto; }
    .masthead { min-height: 106px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--rule); }
    .wordmark { font-size: 19px; font-weight: 750; letter-spacing: .105em; white-space: nowrap; }
    nav { display: flex; gap: 34px; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; text-decoration: none; }
    nav a:hover { text-decoration: underline; color: var(--accent); }
    .hero { padding-top: 66px; }
    h1 { margin: 0; font-size: clamp(64px, 8.45vw, 138px); font-weight: 500; line-height: .99; letter-spacing: -.065em; }
    h1 span { display: block; }
    .hero-detail { display: flex; align-items: center; justify-content: space-between; gap: 32px; margin: 35px 0 40px; }
    .subheading { margin: 0; max-width: 410px; font-size: 19px; line-height: 1.5; letter-spacing: -.02em; text-wrap: pretty; }
    .explore { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: space-between; gap: 42px; min-height: 58px; padding: 17px 23px; background: var(--accent); color: var(--paper); font-size: 14px; font-weight: 600; text-decoration: none; border: 1px solid var(--accent); border-radius: 0; }
    .explore:hover { background: var(--ink); border-color: var(--ink); }
    .explore svg { width: 18px; height: 18px; }
    .film { position: relative; aspect-ratio: 2.15; overflow: hidden; background: var(--ink); }
    .film img, .film video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 50%; }
    .film video { z-index: 1; }
    .media-toggle { position: absolute; z-index: 2; bottom: 22px; right: 22px; display: grid; place-items: center; width: 48px; height: 48px; padding: 0; border: 1px solid var(--paper); border-radius: 0; background: var(--paper); color: var(--ink); cursor: pointer; }
    .media-toggle:hover { background: var(--ink); color: var(--paper); }
    .media-toggle svg { width: 18px; height: 18px; }
    .media-toggle .play-icon { display: none; }
    .media-toggle[data-paused="true"] .play-icon { display: block; }
    .media-toggle[data-paused="true"] .pause-icon { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .work { display: grid; grid-template-columns: 1fr 2fr; gap: 32px; padding-top: 86px; padding-bottom: 84px; }
    h2 { margin: 0; font-size: 16px; line-height: 1.5; font-weight: 500; }
    .work-list { border-top: 1px solid var(--rule); }
    .work-entry { margin: 0; padding: 25px 0 29px; border-bottom: 1px solid var(--rule); font-size: clamp(25px, 3vw, 45px); line-height: 1.25; letter-spacing: -.045em; }
    .work-entry .year { font-size: .55em; letter-spacing: -.02em; white-space: nowrap; }
    .about { display: grid; grid-template-columns: 1fr 2fr; gap: 32px; border-top: 1px solid var(--rule); padding: 35px 0 64px; }
    .about p { grid-column: 2; margin: 0; font-size: clamp(23px, 2.6vw, 38px); line-height: 1.3; letter-spacing: -.04em; }
    @media (min-width: 1700px) { .hero { padding-top: 82px; } }
    @media (max-width: 900px) {
      .shell { width: calc(100% - 64px); }
      .masthead { min-height: 90px; }
      .hero { padding-top: 55px; }
      h1 { font-size: 8.45vw; }
      .subheading { max-width: 310px; font-size: 17px; }
      .explore { gap: 26px; padding-inline: 18px; }
      .film { aspect-ratio: 1.8; }
      .work { grid-template-columns: 1fr 2.3fr; padding-block: 60px; }
      .about { grid-template-columns: 1fr 2.3fr; }
    }
    @media (max-width: 540px) {
      .shell { width: calc(100% - 40px); }
      .masthead { min-height: 79px; gap: 12px; }
      .wordmark { font-size: 14px; letter-spacing: .075em; }
      nav { gap: 16px; }
      nav a { font-size: 12px; }
      .hero { padding-top: 47px; }
      h1 { font-size: 10.5vw; line-height: 1.07; letter-spacing: -.065em; }
      .hero-detail { display: block; margin: 24px 0 29px; }
      .subheading { max-width: 275px; font-size: 16px; line-height: 1.55; }
      .explore { min-height: 52px; margin-top: 24px; padding: 14px 18px; gap: 35px; }
      .film { aspect-ratio: 1.45; }
      .media-toggle { right: 12px; bottom: 12px; width: 44px; height: 44px; }
      .work { display: block; padding-block: 44px; }
      h2 { margin-bottom: 23px; font-size: 15px; }
      .work-entry { padding-block: 22px; font-size: 28px; }
      .about { display: block; padding: 27px 0 42px; }
      .about p { max-width: 290px; font-size: 27px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .masthead { min-height: 68px; }
      .hero { padding-top: 30px; }
      h1 { font-size: clamp(46px, 7.7vw, 86px); }
      .hero-detail { margin-block: 23px; }
      .film { aspect-ratio: 2.5; }
      .work { padding-block: 42px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="masthead shell">
    <div class="wordmark">FIELD NOTES</div>
    <nav aria-label="Main navigation">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="mailto:studio@example.test">Contact</a>
    </nav>
  </header>
  <main class="shell">
    <section class="hero" aria-labelledby="hero-heading">
      <h1 id="hero-heading"><span>Make room for</span> <span>the moving world.</span></h1>
      <div class="hero-detail">
        <p class="subheading">Thoughtful films, clear stories, lasting places.</p>
        <a class="explore" href="#work">Explore the work <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v16m-6-6 6 6 6-6" stroke="currentColor" stroke-width="1.5"/></svg></a>
      </div>
      <div class="film" data-media>
        <img src="assets/poster.svg" alt="" width="960" height="540" fetchpriority="high">
        <video data-src="assets/scene.webm" poster="assets/poster.svg" muted playsinline loop preload="none" aria-hidden="true" hidden></video>
        <button class="media-toggle" type="button" aria-label="Play background video" data-paused="true" hidden>
          <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
          <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m8 4 12 8-12 8z"/></svg>
        </button>
        <span class="sr-only" data-media-status role="status"></span>
      </div>
    </section>
    <section class="work" id="work" aria-labelledby="work-heading">
      <h2 id="work-heading">Selected work</h2>
      <div class="work-list">
        <p class="work-entry">Tidal study <span class="year">/ 2026</span></p>
        <p class="work-entry">Mountain light <span class="year">/ 2025</span></p>
      </div>
    </section>
    <section class="about" id="about" aria-label="About">
      <p>An independent film practice.</p>
    </section>
  </main>
  <script>
    (() => {
      const root = document.querySelector('[data-media]');
      const video = root.querySelector('video');
      const button = root.querySelector('button');
      const status = root.querySelector('[data-media-status]');
      if (!window.matchMedia || !window.IntersectionObserver || !window.AbortController) return;
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      const controller = new AbortController();
      const options = { signal: controller.signal };
      let visible = false, userPaused = false, blocked = false, failed = false, disposed = false, epoch = 0;
      const label = (paused) => {
        button.dataset.paused = String(paused);
        button.setAttribute('aria-label', paused ? 'Play background video' : 'Pause background video');
      };
      const still = () => {
        epoch++;
        video.pause();
        video.hidden = true;
        label(true);
      };
      const sync = async () => {
        button.hidden = reduce.matches || failed || disposed;
        if (disposed || reduce.matches || !visible || document.hidden || userPaused || blocked || failed) {
          still();
          return;
        }
        if (!video.getAttribute('src')) video.src = video.dataset.src;
        const attempt = ++epoch;
        try {
          await video.play();
          if (attempt !== epoch) return;
          video.hidden = false;
          label(false);
          status.textContent = '';
        } catch {
          if (attempt !== epoch) return;
          blocked = true;
          still();
          status.textContent = 'Static preview. Background playback unavailable.';
        }
      };
      const observer = new IntersectionObserver(([entry]) => {
        visible = entry.isIntersecting;
        sync();
      }, { threshold: 0 });
      try {
        video.muted = true;
        button.addEventListener('click', () => {
          userPaused = !video.paused;
          blocked = false;
          sync();
        }, options);
        reduce.addEventListener('change', sync, options);
        document.addEventListener('visibilitychange', sync, options);
        video.addEventListener('error', () => {
          failed = true;
          still();
          button.hidden = true;
          status.textContent = 'Static preview. Background video unavailable.';
        }, options);
        observer.observe(root);
        window.addEventListener('pagehide', () => {
          disposed = true;
          still();
          button.hidden = true;
          observer.disconnect();
          controller.abort();
        }, options);
      } catch {
        disposed = true;
        still();
        button.hidden = true;
        observer.disconnect();
        controller.abort();
      }
    })();
  </script>
</body>
</html>
