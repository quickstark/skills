<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIELD NOTES</title>
<style>
:root{--paper:#f6f3eb;--ink:#163b43;--accent:#bf4e2e;--radius:0px;--font:system-ui}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px var(--font)}
header,section{padding:32px}
a,button{border-radius:var(--radius);font-family:var(--font)}
.cta{display:inline-block;background:var(--ink);color:var(--paper);padding:16px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}

header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px clamp(24px,5vw,80px);border-bottom:1px solid var(--ink)}
header span{font-size:18px;font-weight:750;letter-spacing:.16em}
nav{display:flex;gap:clamp(20px,3vw,48px);font-size:15px}
#intro{display:grid;grid-template-columns:1.05fr 1fr;min-height:690px;padding:0;border-bottom:1px solid var(--ink)}
.intro-copy{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:64px clamp(24px,5vw,80px) 72px;min-width:0}
.eyebrow{margin:0 0 38px;font-size:12px;line-height:1.5;letter-spacing:.17em}
.eyebrow::before{content:"";display:inline-block;width:22px;height:2px;background:var(--accent);vertical-align:middle;margin-right:12px}
h1{position:relative;margin:0;max-width:720px;font-size:clamp(56px,6.25vw,100px);font-weight:500;line-height:1.02;letter-spacing:-.065em;text-wrap:balance}
.intro-description{max-width:310px;margin:30px 0 32px;line-height:1.65;font-size:17px}
.hero-media{position:relative;overflow:hidden;min-width:0;min-height:100%;margin:0;background:var(--ink);border-left:1px solid var(--ink)}
.hero-media video{display:block;width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:76% center}
.hero-media::after{content:"";position:absolute;inset:20px;border:1px solid var(--paper);opacity:.28;pointer-events:none}
#work{padding:80px clamp(24px,5vw,80px) 96px;scroll-margin-top:24px}
.work-heading{display:flex;align-items:center;gap:32px;margin-bottom:40px}
h2{margin:0;font-size:clamp(38px,4.2vw,64px);font-weight:500;line-height:1.1;letter-spacing:-.045em}
.work-heading::after{content:"";flex:1;height:1px;background:var(--ink);opacity:.3}
.work-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:clamp(32px,5vw,80px);align-items:center}
.work-still{position:relative;margin:0;overflow:hidden;background:var(--ink);aspect-ratio:16/9}
.work-still img{display:block;width:100%;height:100%;object-fit:cover}
.work-summary{border-top:2px solid var(--accent);padding-top:24px;min-width:0}
.work-title{margin:0 0 28px;font-size:clamp(24px,2.4vw,36px);line-height:1.25;letter-spacing:-.025em}
#detail{margin:24px 0 0;line-height:1.65}

@media (prefers-reduced-motion:no-preference){
 .intro-copy>*{animation:enter-copy .85s cubic-bezier(.2,.7,.2,1) both}
 .intro-copy>:nth-child(2){animation-delay:.1s}
 .intro-copy>:nth-child(3){animation-delay:.2s}
 .intro-copy>:nth-child(4){animation-delay:.3s}
 .hero-media{animation:open-frame 1.1s cubic-bezier(.2,.7,.2,1) both}
 .motion-ready [data-reveal]{opacity:0;transform:translateY(24px);transition:opacity .75s ease,transform .75s cubic-bezier(.2,.7,.2,1)}
 .motion-ready [data-reveal].is-visible{opacity:1;transform:translateY(0)}
 .work-summary[data-reveal]{transition-delay:.12s}
 @keyframes enter-copy{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
 @keyframes open-frame{from{clip-path:inset(0 0 0 12%);opacity:0}to{clip-path:inset(0);opacity:1}}
}
@media (min-width:1600px){
 #intro{min-height:780px}
 .intro-copy{padding-left:max(80px,calc((100vw - 1440px)/2))}
}
@media (max-width:900px){
 #intro{min-height:600px;grid-template-columns:1.1fr 1fr}
 .intro-copy{padding:48px 32px}
 h1{font-size:clamp(52px,7.2vw,68px)}
 .eyebrow{font-size:11px;letter-spacing:.1em;margin-bottom:28px}
 .eyebrow::before{width:14px;margin-right:8px}
 .work-grid{grid-template-columns:1.45fr 1fr;gap:32px}
}
@media (max-width:640px){
 header{padding:24px;gap:16px}
 header span{font-size:14px;letter-spacing:.12em}
 nav{gap:18px;font-size:14px}
 #intro{grid-template-columns:1fr;min-height:0}
 .intro-copy{padding:44px 24px 48px}
 h1{font-size:clamp(50px,12vw,76px);max-width:520px}
 .intro-description{margin-top:24px;margin-bottom:28px}
 .hero-media{height:clamp(280px,78vw,440px);min-height:0;border-left:0;border-top:1px solid var(--ink)}
 .hero-media video{object-position:center}
 .hero-media::after{inset:14px}
 #work{padding:48px 24px 64px}
 .work-heading{gap:24px;margin-bottom:28px}
 .work-grid{grid-template-columns:1fr;gap:28px}
 .work-summary{padding-top:20px}
 .work-title{margin-bottom:22px}
}
</style>
</head>
<body>
<header><span>FIELD NOTES</span><nav aria-label="Main"><a href="#work">Work</a><a href="mailto:studio@example.test">Contact</a></nav></header>
<main>
<section id="intro">
 <div class="intro-copy">
  <p class="eyebrow">INDEPENDENT FILM / 2026</p>
  <h1>Make room for the moving world.</h1>
  <p class="intro-description">Thoughtful films, clear stories, lasting places.</p>
  <a class="cta" id="explore" href="#work" data-track="explore">Explore the work</a>
 </div>
 <figure class="hero-media">
  <video muted loop playsinline controls preload="none" poster="assets/poster.svg" aria-label="Animated geometric study">
   <source src="assets/scene.webm" type="video/webm">
  </video>
 </figure>
</section>
<section id="work">
 <div class="work-heading" data-reveal><h2>Selected work</h2></div>
 <div class="work-grid">
  <figure class="work-still" data-reveal><img src="assets/poster.svg" alt="" width="960" height="540" loading="lazy"></figure>
  <div class="work-summary" data-reveal>
   <p class="work-title">Tidal study / 2026</p>
   <button id="details" type="button">Show details</button>
   <p id="detail" hidden>Filmed on the northern coast.</p>
  </div>
 </div>
</section>
</main>
<script>window.analytics=[];document.querySelector('[data-track]').addEventListener('click',()=>window.analytics.push('explore'));document.querySelector('#details').addEventListener('click',()=>{document.querySelector('#detail').hidden=!document.querySelector('#detail').hidden});</script>
<script>
(() => {
 const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
 const video = document.querySelector('video');
 if (!('IntersectionObserver' in window)) return;

 const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
   if (!entry.isIntersecting) return;
   entry.target.classList.add('is-visible');
   revealObserver.unobserve(entry.target);
  });
 }, {threshold: .12});
 document.querySelectorAll('[data-reveal]').forEach(element => revealObserver.observe(element));
 document.documentElement.classList.add('motion-ready');
 // Keep keyboard navigation immediate, including before viewport entrances finish.
 document.querySelectorAll('[data-reveal]').forEach(element => {
  element.addEventListener('focusin', () => element.classList.add('is-visible'));
 });

 let playbackAttempted = false;
 const mediaObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
   if (!entry.isIntersecting) {
    video.pause();
   } else if (!playbackAttempted && !reducedMotion.matches) {
    playbackAttempted = true;
    video.play().catch(() => {});
   }
  });
 }, {threshold: .2});
 mediaObserver.observe(video);
 const respectMotionPreference = () => {
  if (reducedMotion.matches) video.pause();
 };
 reducedMotion.addEventListener('change', respectMotionPreference);
 document.addEventListener('visibilitychange', () => {
  if (document.hidden) video.pause();
 });
})();
</script>
</body>
</html>
