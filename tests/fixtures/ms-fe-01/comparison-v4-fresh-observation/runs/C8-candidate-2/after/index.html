<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f49">
  <meta name="description" content="A quiet study. An independent film practice.">
  <title>A quiet study. — An independent film practice.</title>
  <style>
    :root { color-scheme: dark; --paper: #f5f0df; --ink: #173f49; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ink); color: var(--paper); font-family: Arial, Helvetica, sans-serif; }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid #f1b85b; outline-offset: 7px; }
    .skip-link { position: absolute; z-index: 5; top: 16px; left: 16px; padding: 12px 18px; background: var(--paper); color: var(--ink); transform: translateY(-180%); }
    .skip-link:focus { transform: translateY(0); }
    .hero { position: relative; min-height: 760px; min-height: 100svh; isolation: isolate; display: flex; flex-direction: column; overflow: hidden; }
    .hero-image { position: absolute; z-index: -3; width: 100%; height: 100%; object-fit: cover; object-position: 75% center; }
    .hero::after { content: ""; position: absolute; inset: 0; z-index: -2; background: linear-gradient(180deg, rgba(9,30,35,.12) 20%, rgba(9,30,35,.1) 42%, rgba(9,30,35,.78) 100%); }
    .masthead { margin: 0 4.5%; padding: 30px 0; border-bottom: 1px solid rgba(245,240,223,.35); display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .mark { width: 31px; height: 31px; border: 1px solid currentColor; display: grid; place-items: center; }
    .mark::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: currentColor; }
    .masthead p, .hero-foot { margin: 0; font-size: 11px; line-height: 1.5; letter-spacing: .16em; text-transform: uppercase; }
    .hero-content { margin-top: auto; padding: 110px 4.5% 48px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 36px; align-items: end; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(68px, 9.6vw, 164px); font-weight: 400; letter-spacing: -.065em; line-height: .98; margin: 0 0 30px -.055em; }
    .intro { margin: 0; font-size: clamp(16px, 1.5vw, 21px); line-height: 1.5; letter-spacing: -.02em; }
    .explore { width: 142px; aspect-ratio: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; background: var(--paper); color: var(--ink); text-decoration: none; font-size: 14px; transition: background-color .2s ease; }
    .explore:hover { background: #f1b85b; }
    .explore .arrow { align-self: flex-end; font-size: 30px; line-height: 1; }
    .hero-foot { margin: 0 4.5%; padding: 19px 0 24px; border-top: 1px solid rgba(245,240,223,.35); display: flex; justify-content: space-between; gap: 20px; font-size: 10px; }
    .work { padding: 86px 4.5% 40px; background: var(--paper); color: var(--ink); }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding-bottom: 26px; border-bottom: 1px solid rgba(23,63,73,.3); }
    h2 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(38px, 5vw, 70px); line-height: 1.1; font-weight: 400; letter-spacing: -.045em; }
    .section-heading span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    figure { margin: 36px 0 0; }
    .work img { display: block; width: 100%; height: auto; background: var(--ink); }
    figcaption { padding: 19px 0 4px; display: flex; justify-content: space-between; gap: 24px; font-size: 12px; line-height: 1.6; }
    figcaption p { margin: 0; }
    @media (min-width: 1600px) { .hero-content { padding-bottom: 64px; } }
    @media (max-width: 700px) {
      .hero { min-height: 660px; min-height: 100svh; }
      .masthead { padding: 23px 0; margin-inline: 6%; }
      .masthead p { font-size: 9px; letter-spacing: .1em; }
      .hero-image { object-position: 73% center; }
      .hero-content { padding: 100px 6% 32px; grid-template-columns: 1fr; gap: 30px; }
      h1 { max-width: 6em; font-size: clamp(64px, 13vw, 91px); margin-bottom: 22px; }
      .explore { width: 106px; padding: 14px; font-size: 13px; }
      .hero-foot { margin-inline: 6%; font-size: 9px; letter-spacing: .09em; }
      .work { padding: 56px 6% 28px; }
      .section-heading { align-items: center; }
      .section-heading span { font-size: 9px; }
      figure { margin-top: 26px; }
      figcaption { flex-direction: column; gap: 4px; }
    }
    @media (max-height: 540px) and (min-width: 701px) {
      .hero { min-height: 540px; }
      .hero-content { padding-top: 70px; }
      h1 { font-size: 85px; }
    }
    @media (prefers-reduced-motion: reduce) { .explore { transition: none; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#work">Skip to selected work</a>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <img class="hero-image" src="assets/poster.svg" alt="" width="960" height="540" fetchpriority="high">
      <header class="masthead">
        <span class="mark" aria-hidden="true"></span>
        <p>Independent film practice</p>
      </header>
      <div class="hero-content">
        <div>
          <h1 id="hero-title">A quiet study.</h1>
          <p class="intro">An independent film practice.</p>
        </div>
        <a class="explore" href="#work"><span>Explore</span><span class="arrow" aria-hidden="true">↗</span></a>
      </div>
      <div class="hero-foot"><span>Image, form &amp; atmosphere</span><span>Poster / Still image</span></div>
    </section>
    <section class="work" id="work" aria-labelledby="work-title">
      <div class="section-heading"><h2 id="work-title">Selected work</h2><span>A quiet study.</span></div>
      <figure>
        <img src="assets/poster.svg" alt="A warm golden circle above a pale green curved landscape against a deep teal sky." width="960" height="540" loading="lazy">
        <figcaption><p>Supplied poster</p><p>Presented as a still. Footage has not been supplied.</p></figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
